<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- route-meta:start -->
    <title>Ayumad.me — Ayush Madhukar</title>
    <meta name="description" content="Ayush Madhukar's projects and notes on local AI, Linux, audio, cameras, and self-hosted systems.">
    <!-- route-meta:end -->
    <meta name="theme-color" content="#040707">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=1">
    <script>
      (() => {
        function preference(key) {
          try { return localStorage.getItem(key); } catch { return null; }
        }
        const saved = preference("ayumad-theme");
        const systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme =
          saved === "light" || saved === "dark" ? saved : systemDark ? "dark" : "light";
        const renderer = preference("ayumad-renderer");
        document.documentElement.dataset.renderer =
          renderer === "dither" ||
          renderer === "glitch" ||
          renderer === "particles" ||
          renderer === "crt"
            ? renderer
            : "ascii";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Interactive features need JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
