<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Life — Ayumad.me</title>
    <style>
<!--INLINE:../tokens.css-->
<!--INLINE:life.css-->
    </style>
  </head>
  <body>
    <div class="life">
      <header class="masthead">
        <a class="brand" href="/">AYUMAD<span>/</span>LIFE</a>
        <span id="source" class="source" data-tone="soft">—</span>
        <nav aria-label="Dashboard links">
          <a href="/vault">Vault</a>
          <a href="/status">Status</a>
          <a id="signin" href="/dashboard/login?next=%2Fdashboard" hidden>Sign in</a>
        </nav>
      </header>

      <main>
        <div class="hero">
          <section class="time" aria-label="Pacific time">
            <time id="dayline" class="dayline">—</time>
            <div class="clockface">
              <span id="clock">—</span>
              <span class="clocktail"><span id="ampm">—</span><span id="secs">—</span></span>
            </div>
            <div class="clocktrack" aria-hidden="true"><i id="secfill"></i></div>
          </section>

          <section id="focus" class="focus" data-tone="soft" aria-labelledby="focuslabel">
            <h2 id="focuslabel" class="label">Current focus</h2>
            <div class="focus-body" aria-live="polite">
              <span id="focuskicker" class="focus-kicker">—</span>
              <h1 id="focustitle">—</h1>
              <p id="focusdetail">—</p>
            </div>
          </section>

          <section id="weather" class="weather" aria-labelledby="weatherlabel">
            <h2 id="weatherlabel" class="label">San Jose weather</h2>
            <div class="conditions">
              <span id="wicon" class="weather-icon"></span>
              <b id="wtemp">—</b>
              <span class="weather-copy"><span id="wcond">—</span><span id="wrange" class="meta">—</span></span>
            </div>
            <div id="forecast" class="forecast" aria-label="Forecast">—</div>
          </section>
        </div>

        <div class="workspace">
          <section id="constellation" class="constellation" aria-labelledby="maplabel">
            <div class="map-head">
              <h2 id="maplabel" class="label">Focus constellation</h2>
              <span id="mapmeta" class="meta">—</span>
            </div>
            <div class="sky" id="sky">
              <canvas id="radar" aria-hidden="true"></canvas>
              <div id="hubs" class="hubs"></div>
            </div>
            <div id="hubdetail" class="map-detail"><b id="hubdetail-label">—</b><span id="hubdetail-text">—</span></div>
          </section>

          <div class="schedule">
            <section id="today" aria-labelledby="todaylabel">
              <div class="section-head">
                <h2 id="todaylabel" class="label">Today</h2><span id="calmeta" class="meta">—</span>
              </div>
              <div class="daytrack" aria-hidden="true"><i id="dayfill"></i><span id="dayticks"></span></div>
              <div class="dayhours meta" aria-hidden="true"><span>00</span><span>06</span><span>12</span><span>18</span><span>24</span></div>
              <ul id="events" class="rail"><li class="placeholder">—</li></ul>
            </section>
            <section id="week" aria-labelledby="weeklabel">
              <div class="section-head">
                <h2 id="weeklabel" class="label">This week</h2><span id="weekmeta" class="meta">—</span>
              </div>
              <ul id="weekrows" class="rail"><li class="placeholder">—</li></ul>
            </section>
          </div>

          <div class="actions">
            <section id="task-panel" aria-labelledby="tasklabel">
              <div class="section-head">
                <h2 id="tasklabel" class="label">Tasks</h2><span id="taskmeta" class="meta">—</span>
              </div>
              <ul id="tasks" class="rail"><li class="placeholder">—</li></ul>
            </section>
            <section id="school-panel" aria-labelledby="schoollabel">
              <div class="section-head">
                <h2 id="schoollabel" class="label">School deadlines</h2><span id="schoolmeta" class="meta">—</span>
              </div>
              <ul id="school" class="rail"><li class="placeholder">—</li></ul>
            </section>
          </div>
        </div>
      </main>

      <footer id="health" class="health">
        <a class="pulse" href="/status">
          <span id="pulse" data-tone="soft">—</span>
          <span class="pulse-domain"><small>Hermes</small><b id="hermes-state">—</b></span>
          <span class="pulse-domain"><small>Homelab</small><b id="homelab-state">—</b></span>
          <span class="pulse-domain services">
            <small>Services</small><b id="services">—</b>
            <svg id="service-trend" viewBox="0 0 88 20" aria-hidden="true"><line x1="3" x2="85" y1="17" y2="17" /><polyline /><circle r="2" /></svg>
          </span>
          <span class="pulse-domain devices"><small>Devices</small><b id="devices">—</b></span>
        </a>
        <span id="updated" class="meta">—</span>
      </footer>
    </div>

    <script>
<!--INLINE:life.js-->
    </script>
  </body>
</html>
