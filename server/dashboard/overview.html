<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#040707" />
    <title>Life — Ayumad.me</title>
    <style>
:root {
  color-scheme: dark;
  --bg: #040707;
  --surface: #091011;
  --surface-2: #0e191a;
  --text: #e5f4f2;
  --soft: #9bb7b3;
  --muted: #627d79;
  --line: #294441;
  --fine: #142624;
  --cyan: #48efd0;
  --secondary: var(--cyan);
  --violet: #777fc4;
  --ink: #020606;
  --warn: #e0b070;
  --bad: #e08a8a;
  --mono: "SFMono-Regular", "Cascadia Code", "Roboto Mono", Consolas, monospace;
  --sans: Inter, "Helvetica Neue", Helvetica, Arial, sans-serif;
  --display: var(--sans);
  --max: 1460px;
  --header: 72px;
}

:root[data-theme="light"] {
  color-scheme: light;
  --bg: #e6efed;
  --surface: #f3f8f7;
  --surface-2: #d4e2df;
  --text: #071311;
  --soft: #314b47;
  --muted: #5d7470;
  --line: #758e89;
  --fine: #c0d1ce;
  --cyan: #006f68;
  --secondary: var(--cyan);
  --violet: #50568d;
  --ink: #f4fffd;
  --warn: #8a5a12;
  --bad: #9b2f2f;
}

/*
  Background motif (copy from the live site, do not approximate):
  - 104px line grid using --fine at 1px
  - 5px dot matrix using --cyan at 22% opacity
  - two radial masks: top-right and bottom-left
  See ~/Documents/GitHub/ayumad.me/src/styles.css -> body / body::before.
*/

/* base.css — reset, motif (copied verbatim from the live site's body rules),
   focus, and shared type utilities. Colors come only from tokens.css. */

* {
  box-sizing: border-box;
}

html {
  min-width: 320px;
  background: var(--bg);
  scroll-behavior: smooth;
  scrollbar-color: var(--cyan) var(--bg);
}

body {
  min-width: 320px;
  min-height: 100vh;
  margin: 0;
  overflow-x: hidden;
  background:
    linear-gradient(90deg, transparent 49.8%, var(--fine) 50%, transparent 50.2%) 0 0 / 104px 104px,
    linear-gradient(0deg, transparent 49.8%, var(--fine) 50%, transparent 50.2%) 0 0 / 104px 104px,
    var(--bg);
  color: var(--text);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
}

body::before {
  position: fixed;
  z-index: -2;
  inset: 0;
  background:
    radial-gradient(circle, color-mix(in srgb, var(--cyan) 46%, transparent) 0 0.8px, transparent 1px)
      0 0 / 5px 5px;
  content: "";
  opacity: 0.22;
  mask-image:
    radial-gradient(ellipse 58% 42% at 86% 3%, black 0 18%, transparent 70%),
    radial-gradient(ellipse 44% 35% at 7% 82%, black, transparent 72%);
  pointer-events: none;
}

button,
a,
summary {
  -webkit-tap-highlight-color: transparent;
}

button,
input,
textarea,
select {
  font: inherit;
}

:focus-visible {
  outline: 2px solid var(--cyan);
  outline-offset: 4px;
}

::selection {
  background: var(--cyan);
  color: var(--ink);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.mono {
  font-family: var(--mono);
}

.num {
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
}

.muted {
  color: var(--muted);
}

.soft {
  color: var(--soft);
}

.cyan {
  color: var(--cyan);
}

@media (prefers-reduced-motion: reduce) {
  html {
    scroll-behavior: auto;
  }
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

/* life.css — one-screen life view. Deliberately sparse: clock, weather,
   today's agenda, the next few tasks and deadlines, one system pulse. */

html,
body {
  height: 100%;
  overflow: hidden;
}

body {
  min-height: 100dvh;
}

.life {
  display: grid;
  grid-template-rows: 68px minmax(0, 1fr) 56px;
  height: 100dvh;
  max-height: 100dvh;
  overflow: hidden;
}

/* ── header ─────────────────────────────────────────────── */

.lh {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  padding: 0 44px;
  border-bottom: 1px solid var(--line);
}

.lh-l,
.lh-r {
  display: flex;
  align-items: center;
  gap: 14px;
  min-width: 0;
}

.brand {
  color: var(--text);
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.16em;
  text-decoration: none;
  white-space: nowrap;
}

.brand span {
  padding: 0 2px;
  color: var(--cyan);
}

.sep,
.fsep {
  color: var(--muted);
}

.src {
  color: var(--cyan);
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
}

.hdate {
  color: var(--soft);
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  white-space: nowrap;
}

.lnk {
  color: var(--soft);
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.16em;
  text-decoration: none;
  white-space: nowrap;
}

.lnk span {
  color: var(--cyan);
}

.lnk:hover {
  color: var(--cyan);
}

.signin {
  padding: 7px 11px;
  border: 1px solid var(--line);
  border-radius: 2px;
  color: var(--cyan);
}

/* ── main ───────────────────────────────────────────────── */

.lm {
  display: grid;
  grid-template-columns: 1.12fr 1.38fr 0.9fr;
  min-height: 0;
  overflow: hidden;
}

.ltime,
.lagenda,
.lnext {
  min-width: 0;
  min-height: 0;
  padding: 34px 44px 30px;
}

.ltime {
  display: flex;
  flex-direction: column;
}

.lagenda {
  display: flex;
  flex-direction: column;
  border-left: 1px solid var(--line);
}

.lnext {
  display: flex;
  flex-direction: column;
  gap: 34px;
  border-left: 1px solid var(--line);
  padding-right: 38px;
}

/* clock */

.clockwrap {
  display: flex;
  align-items: baseline;
  gap: 12px;
  margin-top: 2px;
}

.clock {
  color: var(--text);
  font-family: var(--mono);
  font-size: clamp(96px, 10.4vw, 196px);
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.075em;
  line-height: 0.84;
}

.ampm {
  color: var(--cyan);
  font-family: var(--mono);
  font-size: clamp(18px, 1.7vw, 30px);
  letter-spacing: 0.02em;
}

.dayline {
  margin-top: 18px;
  color: var(--soft);
  font-family: var(--mono);
  font-size: 13px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

/* weather */

.weather {
  margin-top: 44px;
  padding-bottom: 4px;
}

.wmain {
  display: flex;
  align-items: center;
  gap: 16px;
}

.wglyph {
  color: var(--cyan);
  font-size: clamp(30px, 2.6vw, 44px);
  line-height: 1;
}

.wtemp {
  color: var(--text);
  font-family: var(--mono);
  font-size: clamp(42px, 3.9vw, 68px);
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.04em;
  line-height: 1;
}

.wcond {
  margin-top: 12px;
  color: var(--text);
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.whl {
  margin-top: 7px;
  color: var(--soft);
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.06em;
}

.wplace {
  margin-top: 14px;
  color: var(--muted);
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.18em;
}

/* forecast */

.forecast {
  margin-top: auto;
  padding-top: 18px;
  border-top: 1px solid var(--fine);
}

.flabel {
  color: var(--muted);
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
}

.frows {
  margin-top: 8px;
}

.frow {
  display: grid;
  grid-template-columns: 44px minmax(0, 1fr) auto;
  gap: 12px;
  align-items: baseline;
  padding: 6px 0;
  border-bottom: 1px solid var(--fine);
}

.frow:last-child {
  border-bottom: 0;
}

.fday {
  color: var(--soft);
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.14em;
}

.fcond {
  overflow: hidden;
  color: var(--muted);
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: 0.08em;
  text-overflow: ellipsis;
  text-transform: uppercase;
  white-space: nowrap;
}

.fhl {
  color: var(--text);
  font-family: var(--mono);
  font-size: 11px;
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.02em;
  white-space: nowrap;
}

/* section labels */

.shead {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 14px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--line);
}

.slabel {
  color: var(--cyan);
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.2em;
}

.smeta {
  color: var(--muted);
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.12em;
  text-align: right;
  text-transform: uppercase;
}

/* agenda */

.events {
  display: flex;
  flex-direction: column;
  min-height: 0;
  margin-top: 4px;
}

.ev {
  display: grid;
  grid-template-columns: 78px minmax(0, 1fr);
  gap: 18px;
  padding: 16px 0 15px;
  border-bottom: 1px solid var(--fine);
}

.ev:last-child {
  border-bottom: 0;
}

.ev-t {
  color: var(--cyan);
  font-family: var(--mono);
  font-size: 11.5px;
  letter-spacing: 0.04em;
  line-height: 1.6;
  white-space: nowrap;
}

.ev-t.allday {
  color: var(--soft);
  font-size: 10px;
  letter-spacing: 0.12em;
}

.ev-n {
  display: -webkit-box;
  overflow: hidden;
  color: var(--text);
  font-size: clamp(15px, 1.15vw, 20px);
  font-weight: 400;
  letter-spacing: -0.005em;
  line-height: 1.35;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
}

.ev-c {
  margin-top: 4px;
  overflow: hidden;
  color: var(--muted);
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: 0.1em;
  text-overflow: ellipsis;
  text-transform: uppercase;
  white-space: nowrap;
}

.ev.now .ev-t,
.ev.now .ev-n {
  color: var(--cyan);
}

.more {
  padding-top: 13px;
  color: var(--muted);
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

/* this week */

.week {
  margin-top: auto;
  padding-top: 18px;
  border-top: 1px solid var(--fine);
}

.weekrows {
  margin-top: 5px;
}

.wrow {
  display: grid;
  grid-template-columns: 72px minmax(0, 1fr);
  gap: 14px;
  align-items: baseline;
  padding: 8px 0;
  border-bottom: 1px solid var(--fine);
}

.wrow:last-child {
  border-bottom: 0;
}

.wday {
  color: var(--soft);
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: 0.1em;
  white-space: nowrap;
}

.wname {
  overflow: hidden;
  color: var(--text);
  font-size: 12.5px;
  line-height: 1.3;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.wpub {
  padding: 9px 0;
  color: var(--muted);
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.empty {
  padding: 18px 0;
  color: var(--muted);
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

/* public teaser */

.pub {
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-height: 0;
  padding: 24px 0;
}

.pub-n {
  color: var(--text);
  font-family: var(--mono);
  font-size: clamp(72px, 7vw, 132px);
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.06em;
  line-height: 0.9;
}

.pub-l {
  margin-top: 8px;
  color: var(--cyan);
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.2em;
}

.pub-x {
  margin-top: 22px;
  color: var(--soft);
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.pub-s {
  margin-top: 10px;
  color: var(--muted);
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.14em;
}

/* next column */

.block {
  min-height: 0;
}

.rows {
  display: flex;
  flex-direction: column;
}

.row {
  padding: 12px 0 11px;
  border-bottom: 1px solid var(--fine);
}

.row:last-child {
  border-bottom: 0;
}

.row-t {
  display: -webkit-box;
  overflow: hidden;
  color: var(--text);
  font-size: 13.5px;
  line-height: 1.35;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
}

.row-m {
  margin-top: 4px;
  color: var(--muted);
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.row-m.bad {
  color: var(--bad);
}

.row-m.warn {
  color: var(--warn);
}

.row-count {
  padding: 16px 0 0;
  color: var(--soft);
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

/* quick links */

.links {
  margin-top: auto;
}

.lgrid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 7px;
  padding-top: 13px;
}

.lgrid a {
  padding: 8px 9px;
  border: 1px solid var(--line);
  border-radius: 2px;
  color: var(--soft);
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: 0.14em;
  text-align: center;
  text-decoration: none;
}

.lgrid a:hover {
  border-color: var(--cyan);
  color: var(--cyan);
}

/* ── footer ─────────────────────────────────────────────── */

.lf {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  padding: 0 44px;
  border-top: 1px solid var(--line);
}

.pulse {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
  color: var(--soft);
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.12em;
  text-decoration: none;
  text-transform: uppercase;
  white-space: nowrap;
}

.pulse:hover .ptext {
  color: var(--cyan);
}

.dot {
  width: 7px;
  height: 7px;
  flex: none;
  border-radius: 50%;
  background: var(--muted);
}

.dot.ok {
  background: var(--cyan);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--cyan) 14%, transparent);
}

.dot.warn {
  background: var(--warn);
}

.dot.bad {
  background: var(--bad);
}

.ptext {
  color: var(--text);
}

.pmeta {
  overflow: hidden;
  color: var(--muted);
  text-overflow: ellipsis;
}

.fright {
  display: flex;
  align-items: center;
  gap: 9px;
  color: var(--muted);
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  white-space: nowrap;
}

/* ── responsive ─────────────────────────────────────────── */

@media (max-width: 1180px) {
  .lm {
    grid-template-columns: 1fr 1.2fr;
  }
  .lnext {
    display: none;
  }
  .lagenda {
    border-left: 1px solid var(--line);
  }
  .lh,
  .lf {
    padding-right: 28px;
    padding-left: 28px;
  }
  .ltime,
  .lagenda {
    padding: 26px 28px;
  }
}

@media (max-width: 760px) {
  .life {
    grid-template-rows: 56px minmax(0, 1fr) 48px;
  }
  .lh {
    padding: 0 18px;
  }
  .hdate {
    display: none;
  }
  .lm {
    grid-template-columns: 1fr;
    grid-template-rows: auto minmax(0, 1fr);
  }
  .ltime {
    padding: 20px 18px 14px;
  }
  .lagenda {
    padding: 18px;
    border-top: 1px solid var(--line);
    border-left: 0;
  }
  .clock {
    font-size: clamp(68px, 20vw, 96px);
  }
  .ampm {
    font-size: 16px;
  }
  .dayline {
    margin-top: 10px;
    font-size: 10px;
  }
  .weather {
    display: grid;
    grid-template-columns: auto 1fr;
    column-gap: 12px;
    margin-top: 18px;
  }
  .wmain {
    grid-row: span 2;
  }
  .wtemp {
    font-size: 38px;
  }
  .wglyph {
    font-size: 24px;
  }
  .wcond {
    margin-top: 2px;
    font-size: 9.5px;
  }
  .whl {
    margin-top: 2px;
    font-size: 10px;
  }
  .wplace {
    display: none;
  }
  .forecast {
    display: none;
  }
  .ev {
    grid-template-columns: 64px minmax(0, 1fr);
    gap: 12px;
    padding: 11px 0;
  }
  .ev:nth-child(n + 5) {
    display: none;
  }
  .week {
    display: none;
  }
  .ev-n {
    font-size: 14px;
  }
  .lf {
    padding: 0 18px;
  }
  .pmeta,
  .fright span:last-child,
  .fright .fsep {
    display: none;
  }
}

          <div class="shead">

          </div>

            <div class="empty">loading the day…</div>
          </div>
          <div class="week" id="week" hidden>
            <div class="shead">
              <span class="slabel">THIS WEEK</span>

            </div>
            <div class="weekrows" id="weekrows"></div>
          </div>
        </section>

        <section class="lnext">
          <div class="block">
            <div class="shead">
              <span class="slabel">TASKS</span>
              <span class="smeta" id="taskmeta">—</span>
            </div>
            <div class="rows" id="tasks"><div class="empty">—</div></div>
          </div>
          <div class="block">
            <div class="shead">
              <span class="slabel">SCHOOL</span>
              <span class="smeta" id="schoolmeta">—</span>
            </div>
            <div class="rows" id="school"><div class="empty">—</div></div>
          </div>
          <div class="block links">
            <div class="shead">
              <span class="slabel">QUICK</span>
            </div>
            <div class="lgrid">
              <a href="/vault">VAULT</a>
              <a href="https://canvas.sjsu.edu" target="_blank" rel="noreferrer">CANVAS</a>
              <a href="https://mail.google.com" target="_blank" rel="noreferrer">GMAIL</a>
              <a href="https://github.com/Ayumad" target="_blank" rel="noreferrer">GITHUB</a>
            </div>
          </div>
        </section>
      </main>

      <footer class="lf">
        <a class="pulse" href="/status">
          <i class="dot" id="dot"></i>
          <span class="ptext" id="pulse">SYSTEM —</span>
          <span class="pmeta" id="pmeta"></span>
        </a>
        <div class="fright">
          <span id="updated">—</span>
          <span class="fsep">·</span>
          <span>AYUMAD.ME</span>
        </div>
      </footer>
    </div>

    <script>
/* life.js — one screen, no dependencies. Time is live; weather comes from
   Open-Meteo; everything personal comes from the dashboard snapshot. The
   public projection only carries counts, so signed-out visitors see a teaser. */
(() => {
  "use strict";

  const LA = "America/Los_Angeles";
  const $ = (id) => document.getElementById(id);
  const esc = (value) =>
    String(value ?? "").replace(/[&<>"']/g, (c) => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;",
    })[c]);

  const WMO = {
    0: "CLEAR", 1: "MOSTLY CLEAR", 2: "PARTLY CLOUDY", 3: "OVERCAST",
    45: "FOG", 48: "FREEZING FOG",
    51: "LIGHT DRIZZLE", 53: "DRIZZLE", 55: "HEAVY DRIZZLE",
    56: "FREEZING DRIZZLE", 57: "FREEZING DRIZZLE",
    61: "LIGHT RAIN", 63: "RAIN", 65: "HEAVY RAIN",
    66: "FREEZING RAIN", 67: "FREEZING RAIN",
    71: "LIGHT SNOW", 73: "SNOW", 75: "HEAVY SNOW", 77: "SNOW GRAINS",
    80: "LIGHT SHOWERS", 81: "SHOWERS", 82: "HEAVY SHOWERS",
    85: "SNOW SHOWERS", 86: "SNOW SHOWERS",
    95: "THUNDERSTORM", 96: "THUNDERSTORM", 99: "THUNDERSTORM",
  };

  const GLYPH = {
    0: "☀", 1: "☀", 2: "⛅", 3: "☁",
    45: "▒", 48: "▒",
    51: "☂", 53: "☂", 55: "☂", 56: "☂", 57: "☂",
    61: "☂", 63: "☂", 65: "☂", 66: "☂", 67: "☂",
    71: "❄", 73: "❄", 75: "❄", 77: "❄", 85: "❄", 86: "❄",
    80: "☂", 81: "☂", 82: "☂",
    95: "ϟ", 96: "ϟ", 99: "ϟ",
  };

  const todayKey = () => dayKey(0);

  function dayKey(offset = 0) {
    const date = new Date();
    date.setDate(date.getDate() + offset);
    return new Intl.DateTimeFormat("en-CA", {
      timeZone: LA, year: "numeric", month: "2-digit", day: "2-digit",
    }).format(date);
  }

  function calLabel(cal) {
    const value = String(cal || "").trim();
    if (!value) return "";
    if (/canvas/i.test(value)) return "CANVAS";
    if (value.includes("@")) return /sjsu|school/i.test(value) ? "SCHOOL" : "PERSONAL";
    if (/class/i.test(value)) return "CLASS";
    return value.toUpperCase();
  }

  function clock() {
    const now = new Date();
    const parts = new Intl.DateTimeFormat("en-US", {
      timeZone: LA, hour: "numeric", minute: "2-digit", hour12: true,
    }).formatToParts(now);
    const get = (type) => parts.find((p) => p.type === type)?.value || "";
    $("clock").textContent = `${get("hour")}:${get("minute")}`;
    $("ampm").textContent = get("dayPeriod").toUpperCase();
    $("dayline").textContent = new Intl.DateTimeFormat("en-US", {
      timeZone: LA, weekday: "long", month: "long", day: "numeric", year: "numeric",
    }).format(now).toUpperCase();
    $("hdate").textContent = new Intl.DateTimeFormat("en-US", {
      timeZone: LA, weekday: "short", month: "short", day: "numeric",
    }).format(now).toUpperCase();
  }

  async function getJSON(url) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 7000);
    try {
      const response = await fetch(url, {
        cache: "no-store",
        signal: controller.signal,
        headers: { Accept: "application/json" },
      });
      if (!response.ok) throw new Error(String(response.status));
      const type = response.headers.get("content-type") || "";
      if (!type.includes("json")) throw new Error("not json");
      return await response.json();
    } finally {
      clearTimeout(timer);
    }
  }

  function timeOf(iso) {
    try {
      return new Intl.DateTimeFormat("en-US", {
        timeZone: LA, hour: "numeric", minute: "2-digit", hour12: true,
      }).format(new Date(iso));
    } catch {
      return "—";
    }
  }

  function fmtDate(value) {
    const match = String(value || "").match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (!match) return String(value || "").toUpperCase();
    const date = new Date(`${match[1]}-${match[2]}-${match[3]}T12:00:00Z`);
    return new Intl.DateTimeFormat("en-US", {
      timeZone: "UTC", month: "short", day: "numeric",
    }).format(date).toUpperCase();
  }

  function renderWeek(week, isPublic) {
    const block = $("week");
    const rows = $("weekrows");
    const meta = $("weekmeta");

    if (isPublic) {
      const count = Number(week) || 0;
      block.hidden = count === 0;
      meta.textContent = `${count} ITEMS`;
      rows.innerHTML = count
        ? `<div class="wpub">NEXT 7 DAYS · ${count} ITEMS · SIGN IN FOR DETAILS</div>`
        : "";
      return;
    }

    const items = Array.isArray(week) ? week : [];
    const groups = new Map();
    for (const event of items) {
      const date = String(event.sort || "").slice(0, 10);
      if (!groups.has(date)) groups.set(date, []);
      groups.get(date).push(event);
    }
    const days = [...groups.entries()].slice(0, 5);
    block.hidden = days.length === 0;
    meta.textContent = items.length ? `${items.length} ITEMS` : "";
    rows.innerHTML = days.map(([date, events]) => {
      const day = date
        ? new Intl.DateTimeFormat("en-US", {
            timeZone: "UTC", weekday: "short", month: "short", day: "numeric",
          }).format(new Date(`${date}T12:00:00Z`)).toUpperCase()
        : "—";
      const lead = events.length > 1 ? `${events.length} ITEMS · ` : "";
      return `
        <div class="wrow">
          <span class="wday">${esc(day)}</span>
          <span class="wname">${lead}${esc(events[0].summary || "untitled")}</span>
        </div>`;
    }).join("");
  }

  function renderCalendar(data, isPublic) {
    const events = Array.isArray(data.calendar?.events) ? data.calendar.events : [];
    const count = Number.isFinite(data.calendar?.count) ? data.calendar.count : events.length;
    $("calmeta").textContent = count ? `${count} EVENT${count === 1 ? "" : "S"}` : "CLEAR";

    if (isPublic) {
      const next = events.find((e) => e.time && e.time !== "all-day")?.time;
      $("events").innerHTML = `
        <div class="pub">
          <div class="pub-n">${count}</div>
          <div class="pub-l">EVENTS TODAY</div>
          ${next ? `<div class="pub-x">NEXT ${esc(next)}</div>` : `<div class="pub-x">NO TIMED EVENTS</div>`}
          <div class="pub-s">SIGN IN FOR DETAILS</div>
        </div>`;
      renderWeek(data.calendar?.week_count ?? 0, true);
      return;
    }

    if (!events.length) {
      $("events").innerHTML = `<div class="empty">clear day</div>`;
      renderWeek(data.calendar?.week, false);
      return;
    }

    const today = todayKey();
    const tomorrow = dayKey(1);
    const rows = events.slice(0, 6).map((event) => {
      const allDay = event.time === "all-day";
      const sortDate = String(event.sort || "").slice(0, 10);
      const dueLater = allDay && sortDate > today;
      const dueLabel = sortDate === tomorrow ? "DUE TOMORROW" : "DUE SOON";
      const label = allDay ? (dueLater ? dueLabel : "ALL DAY") : event.time || "—";
      return `
        <div class="ev">
          <div class="ev-t ${allDay ? "allday" : ""}">${esc(label)}</div>
          <div>
            <div class="ev-n">${esc(event.summary || "untitled")}</div>
            <div class="ev-c">${esc(calLabel(event.cal))}</div>
          </div>
        </div>`;
    }).join("");
    const more = events.length > 6
      ? `<div class="more">+ ${events.length - 6} MORE</div>`
      : "";
    $("events").innerHTML = rows + more;
    renderWeek(data.calendar?.week, false);
  }

  function renderTasks(data, isPublic) {
    const tasks = data.tasks || {};
    const open = Number(tasks.open) || 0;
    const overdue = Number(tasks.overdue) || 0;
    $("taskmeta").textContent = `${open} OPEN`;

    if (isPublic) {
      $("tasks").innerHTML = `<div class="row-count">${open} OPEN · ${overdue} OVERDUE</div>`;
      return;
    }

    const items = Array.isArray(tasks.items) ? tasks.items.slice(0, 4) : [];
    $("tasks").innerHTML = items.length
      ? items.map((item) => `
          <div class="row">
            <div class="row-t">${esc(item.title || "untitled")}</div>
            <div class="row-m ${item.overdue ? "bad" : ""}">${item.overdue ? "OVERDUE" : esc(fmtDate(item.due) || "NO DATE")}</div>
          </div>`).join("")
      : `<div class="empty">clear</div>`;
  }

  function renderSchool(data, isPublic) {
    const school = data.school || {};
    const upcoming = Number(school.upcoming) || 0;
    $("schoolmeta").textContent = `${upcoming} UPCOMING`;

    if (isPublic) {
      $("school").innerHTML = `<div class="row-count">${upcoming} UPCOMING</div>`;
      return;
    }

    const next = Array.isArray(school.next) ? school.next.slice(0, 2) : [];
    $("school").innerHTML = next.length
      ? next.map((item) => `
          <div class="row">
            <div class="row-t">${esc(item.title || item.course || "untitled")}</div>
            <div class="row-m ${item.overdue ? "bad" : ""}">${esc(item.course || "")}${item.due ? ` · ${esc(fmtDate(item.due))}` : ""}</div>
          </div>`).join("")
      : `<div class="empty">clear</div>`;
  }

  function renderPulse(data) {
    const now = data.now || {};
    const failing = Number(now.jobs_failing) || 0;
    const bad = (Number(now.homelab_issues_bad) || 0) + failing;
    const warn = Number(now.homelab_issues_warn) || 0;
    const dot = $("dot");

    if (bad > 0) {
      $("pulse").textContent = `${bad} ISSUE${bad === 1 ? "" : "S"}`;
      dot.className = "dot bad";
    } else if (warn > 0) {
      $("pulse").textContent = `${warn} WARNING${warn === 1 ? "" : "S"}`;
      dot.className = "dot warn";
    } else {
      $("pulse").textContent = "ALL CLEAR";
      dot.className = "dot ok";
    }

    $("pmeta").textContent = [
      `${Number(now.jobs_total) || 0} JOBS`,
      `${Number(now.containers_running) || 0} CONTAINERS`,
      `${Number(now.devices_online) || 0}/${Number(now.devices_total) || 0} DEVICES`,
    ].join(" · ");
  }

  function apply(data, source) {
    const isPublic = !!data.public;
    $("source").textContent = isPublic ? "PUBLIC" : source;
    $("signin").hidden = !isPublic;
    renderCalendar(data, isPublic);
    renderTasks(data, isPublic);
    renderSchool(data, isPublic);
    renderPulse(data);
    $("updated").textContent = data.generated_at ? `DATA ${timeOf(data.generated_at)}` : "—";
  }

  async function load() {
    try {
      apply(await getJSON("/dashboard/data"), "SNAPSHOT");
      return;
    } catch {
      /* The wall serves the payload next to the page. */
    }
    try {
      apply(await getJSON("./dashboard.json"), "LIVE");
      return;
    } catch {
      /* fall through */
    }
    try {
      apply(await getJSON("/dashboard.json"), "LIVE");
      return;
    } catch {
      /* fall through */
    }
    $("source").textContent = "OFFLINE";
    $("events").innerHTML = `<div class="empty">data unavailable</div>`;
    $("tasks").innerHTML = `<div class="empty">—</div>`;
    $("school").innerHTML = `<div class="empty">—</div>`;
    $("pulse").textContent = "STATUS UNAVAILABLE";
    $("dot").className = "dot";
  }

  function renderForecast(daily) {
    const times = Array.isArray(daily.time) ? daily.time : [];
    const rows = [];
    for (let i = 1; i < Math.min(times.length, 4); i += 1) {
      const day = new Intl.DateTimeFormat("en-US", {
        timeZone: LA, weekday: "short",
      }).format(new Date(`${times[i]}T12:00:00`)).toUpperCase();
      const code = Number(daily.weather_code?.[i]);
      const high = Math.round(Number(daily.temperature_2m_max?.[i]));
      const low = Math.round(Number(daily.temperature_2m_min?.[i]));
      rows.push(`
        <div class="frow">
          <span class="fday">${esc(day)}</span>
          <span class="fcond">${esc(WMO[code] || "—")}</span>
          <span class="fhl">${high}° / ${low}°</span>
        </div>`);
    }
    $("frows").innerHTML = rows.join("");
    $("forecast").hidden = rows.length === 0;
  }

  async function weather() {
    const url = "https://api.open-meteo.com/v1/forecast?latitude=37.3382&longitude=-121.8863"
      + "&current=temperature_2m,is_day,weather_code"
      + "&daily=temperature_2m_max,temperature_2m_min,weather_code,sunrise,sunset"
      + "&temperature_unit=fahrenheit&timezone=America%2FLos_Angeles&forecast_days=4";
    try {
      const data = await getJSON(url);
      const current = data.current || {};
      const daily = data.daily || {};
      const code = Number(current.weather_code);
      const temp = Math.round(Number(current.temperature_2m));
      const high = Math.round(Number(daily.temperature_2m_max?.[0]));
      const low = Math.round(Number(daily.temperature_2m_min?.[0]));

      $("wtemp").textContent = Number.isFinite(temp) ? `${temp}°` : "—°";
      $("wcond").textContent = WMO[code] || "WEATHER";
      $("whl").textContent = `H ${Number.isFinite(high) ? high : "—"}° · L ${Number.isFinite(low) ? low : "—"}°`;
      $("wglyph").textContent = (!current.is_day && code === 0) ? "☾" : (GLYPH[code] || "·");
      renderForecast(daily);
    } catch {
      $("wcond").textContent = "WEATHER UNAVAILABLE";
      $("whl").textContent = "—";
    }
  }

  clock();
  setInterval(clock, 1000);
  load();
  setInterval(load, 300000);
  weather();
  setInterval(weather, 900000);
})();

    </script>
  </body>
</html>
