<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#040707" />
    <title>Ops — Ayumad.me</title>
    <style>
:root {
  color-scheme: dark;
  --bg: #040707;
  --surface: #091011;
  --surface-2: #0e191a;
  --text: #e5f4f2;
  --soft: #9bb7b3;
  --muted: #627d79;
  --line: #294441;
  --fine: #142624;
  --cyan: #48efd0;
  --secondary: var(--cyan);
  --violet: #777fc4;
  --ink: #020606;
  --warn: #e0b070;
  --bad: #e08a8a;
  --mono: "SFMono-Regular", "Cascadia Code", "Roboto Mono", Consolas, monospace;
  --sans: Inter, "Helvetica Neue", Helvetica, Arial, sans-serif;
  --display: var(--sans);
  --max: 1460px;
  --header: 72px;
}

:root[data-theme="light"] {
  color-scheme: light;
  --bg: #e6efed;
  --surface: #f3f8f7;
  --surface-2: #d4e2df;
  --text: #071311;
  --soft: #314b47;
  --muted: #5d7470;
  --line: #758e89;
  --fine: #c0d1ce;
  --cyan: #006f68;
  --secondary: var(--cyan);
  --violet: #50568d;
  --ink: #f4fffd;
  --warn: #8a5a12;
  --bad: #9b2f2f;
}

/*
  Background motif (copy from the live site, do not approximate):
  - 104px line grid using --fine at 1px
  - 5px dot matrix using --cyan at 22% opacity
  - two radial masks: top-right and bottom-left
  See ~/Documents/GitHub/ayumad.me/src/styles.css -> body / body::before.
*/

/* base.css — reset, motif (copied verbatim from the live site's body rules),
   focus, and shared type utilities. Colors come only from tokens.css. */

* {
  box-sizing: border-box;
}

html {
  min-width: 320px;
  background: var(--bg);
  scroll-behavior: smooth;
  scrollbar-color: var(--cyan) var(--bg);
}

body {
  min-width: 320px;
  min-height: 100vh;
  margin: 0;
  overflow-x: hidden;
  background:
    linear-gradient(90deg, transparent 49.8%, var(--fine) 50%, transparent 50.2%) 0 0 / 104px 104px,
    linear-gradient(0deg, transparent 49.8%, var(--fine) 50%, transparent 50.2%) 0 0 / 104px 104px,
    var(--bg);
  color: var(--text);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
}

body::before {
  position: fixed;
  z-index: -2;
  inset: 0;
  background:
    radial-gradient(circle, color-mix(in srgb, var(--cyan) 46%, transparent) 0 0.8px, transparent 1px)
      0 0 / 5px 5px;
  content: "";
  opacity: 0.22;
  mask-image:
    radial-gradient(ellipse 58% 42% at 86% 3%, black 0 18%, transparent 70%),
    radial-gradient(ellipse 44% 35% at 7% 82%, black, transparent 72%);
  pointer-events: none;
}

button,
a,
summary {
  -webkit-tap-highlight-color: transparent;
}

button,
input,
textarea,
select {
  font: inherit;
}

:focus-visible {
  outline: 2px solid var(--cyan);
  outline-offset: 4px;
}

::selection {
  background: var(--cyan);
  color: var(--ink);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.mono {
  font-family: var(--mono);
}

.num {
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
}

.muted {
  color: var(--muted);
}

.soft {
  color: var(--soft);
}

.cyan {
  color: var(--cyan);
}

@media (prefers-reduced-motion: reduce) {
  html {
    scroll-behavior: auto;
  }
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

/* layout.css — web shell: header, hero, sections, wall shell, responsive. */

.app {
  min-height: 100vh;
}

.wrap {
  max-width: var(--max);
  margin: 0 auto;
  padding: 0 clamp(16px, 3vw, 40px);
}

/* ---------- header ---------- */

.hdr {
  position: sticky;
  top: 0;
  z-index: 20;
  height: var(--header);
  display: flex;
  align-items: center;
  border-bottom: 1px solid var(--line);
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(6px);
}

.hdr-in {
  width: 100%;
  max-width: var(--max);
  margin: 0 auto;
  padding: 0 clamp(16px, 3vw, 40px);
  display: flex;
  align-items: center;
  gap: 20px;
}

.brand {
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.08em;
  color: var(--text);
  text-decoration: none;
  white-space: nowrap;
}

.brand .sl {
  color: var(--cyan);
  margin: 0 2px;
}

.brand .dim {
  color: var(--muted);
  font-weight: 500;
}

.tabs {
  display: flex;
  gap: 2px;
  margin: 0 auto;
  flex-wrap: wrap;
  justify-content: center;
}

.tab {
  border: 0;
  background: none;
  padding: 8px 8px;
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--soft);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
}

.tab[aria-current="true"] {
  color: var(--cyan);
  border-bottom-color: var(--cyan);
}

.hdr-r {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-left: auto;
  white-space: nowrap;
}

.updated {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--muted);
}

.theme-btn {
  border: 1px solid var(--line);
  border-radius: 2px;
  background: none;
  color: var(--soft);
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 5px 9px;
  cursor: pointer;
}

.theme-btn:hover {
  color: var(--cyan);
  border-color: var(--cyan);
}

.signin {
  border: 1px solid var(--cyan);
  border-radius: 2px;
  color: var(--cyan);
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 5px 9px;
}

.signin:hover {
  color: var(--ink);
  background: var(--cyan);
}

/* ---------- hero ---------- */

.hero {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 8px;
  margin-top: 24px;
}

/* ---------- global mode banner (seed / snapshot; live shows none) ---------- */

.mode-strip {
  margin-top: 14px;
}

.mode-strip .banner {
  border-top: none;
  border-bottom: 1px solid var(--line);
  padding: 7px 2px;
}

/* generic KPI cell cluster */
.cells {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 8px;
}

/* ---------- sections ---------- */

.sec {
  margin-top: 44px;
}

.sec-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  border-bottom: 1px solid var(--line);
  padding-bottom: 12px;
}

.sec-head h2 {
  margin: 0;
  font-family: var(--mono);
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: 0.13em;
  text-transform: uppercase;
  color: var(--cyan);
}

.sec-hint {
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--soft);
  flex-wrap: wrap;
  justify-content: flex-end;
  padding-bottom: 1px;
}

.sec-body {
  padding-top: 14px;
}

.subgrid {
  display: grid;
  gap: 8px;
}

.subgrid.cols-2 {
  grid-template-columns: 1fr 1fr;
}

.subgrid.cols-3 {
  grid-template-columns: repeat(3, 1fr);
}

.subhead {
  font-family: var(--mono);
  font-size: 10.5px;
  font-weight: 500;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
  margin: 18px 0 8px;
}

/* ---------- footer ---------- */

.foot {
  margin-top: 48px;
  margin-bottom: 32px;
  border-top: 1px solid var(--line);
  padding-top: 12px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px 18px;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--muted);
}

/* ---------- drawer ---------- */

.drawer-back {
  position: fixed;
  inset: 0;
  z-index: 40;
  background: color-mix(in srgb, var(--ink) 55%, transparent);
  border: 0;
  padding: 0;
  cursor: default;
}

.drawer {
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  z-index: 41;
  width: min(420px, 100vw);
  background: var(--surface);
  border-left: 1px solid var(--line);
  padding: 18px 20px 24px;
  overflow-y: auto;
  transform: translateX(0);
  transition: transform 120ms ease-out;
}

.drawer[data-open="false"] {
  transform: translateX(102%);
}

.drawer-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  border-bottom: 1px solid var(--line);
  padding-bottom: 10px;
  margin-bottom: 12px;
}

.drawer-title {
  font-family: var(--mono);
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  margin: 0;
  overflow-wrap: anywhere;
}

.drawer-close {
  border: 1px solid var(--line);
  border-radius: 2px;
  background: none;
  color: var(--soft);
  font-family: var(--mono);
  font-size: 11px;
  padding: 4px 8px;
  cursor: pointer;
}

.drawer-close:hover {
  color: var(--cyan);
  border-color: var(--cyan);
}

/* ---------- wall shell ---------- */

body.wall {
  overflow: hidden;
}

.wall {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  z-index: 10;
}

.wall-hdr {
  height: 64px;
  flex: none;
  display: flex;
  align-items: center;
  gap: 24px;
  padding: 0 32px;
  border-bottom: 1px solid var(--line);
  background: var(--bg);
}

.wall-brand {
  font-family: var(--mono);
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 0.08em;
}

.wall-clock {
  margin-left: auto;
  font-family: var(--mono);
  font-size: 14px;
  font-weight: 500;
  color: var(--soft);
  letter-spacing: 0.04em;
}

.wall-r {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-left: 24px;
}

.wall-progress {
  height: 2px;
  flex: none;
  background: var(--fine);
  position: relative;
  overflow: hidden;
}

.wall-progress i {
  position: absolute;
  inset: 0;
  background: var(--cyan);
  transform-origin: left;
  transform: scaleX(0);
}

.wall-progress i.run {
  animation: wallprog linear forwards;
}

@keyframes wallprog {
  from {
    transform: scaleX(0);
  }
  to {
    transform: scaleX(1);
  }
}

.wall-stage {
  flex: 1;
  position: relative;
  overflow: hidden;
  margin: 32px;
}

.wall-shift {
  position: absolute;
  inset: 0;
  transition: transform 120ms linear;
}

.wall-page {
  position: absolute;
  inset: 0;
  display: none;
  padding: 0;
}

.wall-page[data-active="true"] {
  display: block;
}

.wall-banner {
  flex: none;
  display: none;
  margin: 0 32px;
}

.wall-banner[data-show="true"] {
  display: block;
}

.wall-rail {
  height: 48px;
  flex: none;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 0 32px;
  border-top: 1px solid var(--line);
  background: var(--bg);
  font-family: var(--mono);
  font-size: 12px;
}

.wall-rail .who {
  margin-left: auto;
  color: var(--muted);
  white-space: nowrap;
}

.wall-dim .wall-stage,
.wall-dim .wall-hdr,
.wall-dim .wall-rail {
  opacity: 0.7;
}

/* wall page 1 — three bands: status top, KPI grid fills, alert rail fixed below */

.wp-status {
  height: 100%;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.wp-top {
  flex: none;
  min-height: 196px;
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: 18px 56px;
  padding: 10px 4px 24px;
  border-bottom: 1px solid var(--line);
}

.wp-top-main {
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-width: 0;
}

.wp-word {
  font-family: var(--mono); /* explicit: never fall back to a serif */
  font-size: clamp(48px, 3.6vw, 72px);
  font-weight: 600;
  letter-spacing: 0.02em;
  line-height: 1;
}

.wp-sub {
  font-family: var(--mono);
  font-size: 15px;
  color: var(--soft);
}

.wp-clockbox {
  display: flex;
  flex-direction: column;
  gap: 6px;
  flex: none;
}

.wp-clock {
  font-family: var(--mono); /* explicit: never fall back to a serif */
  font-size: clamp(34px, 2.4vw, 48px);
  font-weight: 600;
  color: var(--text);
  line-height: 1;
}

.wp-date {
  font-family: var(--mono);
  font-size: 16px;
  color: var(--soft);
}

.wp-alert {
  flex: 1 0 100%;
  margin-left: 0;
  display: flex;
  align-items: baseline;
  gap: 12px;
  max-width: none;
  margin-top: 4px;
  padding: 10px 0 0 18px;
  border-left: 3px solid var(--line);
  border-top: 1px solid var(--fine);
  font-family: var(--mono);
  font-size: 24px;
}

.wp-alert .mk {
  width: 8px;
  height: 8px;
  flex: none;
  align-self: center;
  background: var(--cyan);
}

.wp-alert.lvl-bad .mk {
  background: var(--bad);
}

.wp-alert.lvl-bad {
  border-left-color: var(--bad);
  background: color-mix(in srgb, var(--bad) 7%, transparent);
}

.wp-alert.lvl-bad .wp-alert-t {
  color: var(--bad);
}

.wp-alert.lvl-warn .mk {
  background: var(--warn);
}

.wp-alert.lvl-warn {
  border-left-color: var(--warn);
  background: color-mix(in srgb, var(--warn) 6%, transparent);
}

.wp-alert.lvl-warn .wp-alert-t {
  color: var(--warn);
}

.wp-alert.lvl-none .mk {
  background: var(--muted);
}

.wp-alert.lvl-none .wp-alert-t {
  color: var(--soft);
}

.wp-alert-t {
  color: var(--text);
  overflow-wrap: anywhere;
}

.wp-alert-r {
  flex: none;
  font-size: 14px;
  color: var(--muted);
  white-space: nowrap;
}

.wp-kpis {
  flex: 1 1 auto;
  min-height: 0;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-template-rows: 1fr 1fr;
  gap: 10px;
}

.wp-kpis .cell {
  justify-content: center;
  gap: 10px;
  padding: 20px 22px;
}

.wp-kpis .cell-l {
  font-size: 19px;
  letter-spacing: 0.08em;
  color: var(--soft);
}

.wp-kpis .cell-v {
  font-size: clamp(54px, 6.4vh, 72px);
  line-height: 1;
}

.wp-kpis .cell-v small {
  font-size: 24px;
  color: var(--soft);
}

.wp-kpis .cell-s {
  font-size: 15px;
  color: var(--soft);
  margin-top: 0;
}

/* wall automations — two columns; rows stretch to fill the stage */

.wp-jobs {
  height: 100%;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0 40px;
  min-height: 0;
}

.wp-jobs > div {
  display: flex;
  flex-direction: column;
  min-height: 0;
}

.wall .wrow {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 2px 16px;
  align-items: center;
  align-content: center;
  padding: 7px 10px;
  border-bottom: 1px solid var(--fine);
  flex: 1 1 auto;
  min-height: 46px;
}

.wall .wrow.static {
  flex: none;
}

.wall .wrow.fail {
  border-left: 2px solid var(--bad);
}

.wall .wrow .nm {
  font-size: 16px;
  font-weight: 500;
  color: var(--text);
  grid-column: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.wall .wrow .nx {
  font-family: var(--mono);
  font-size: 14px;
  color: var(--muted);
  grid-column: 2;
  grid-row: 1;
  text-align: right;
  white-space: nowrap;
}

.wall .wrow .sc {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: var(--mono);
  font-size: 14px;
  color: var(--soft);
}

/* pending/empty wall states still fill the stage */

.wp-jobs.pending {
  grid-template-columns: 1fr;
}

.wp-jobs.pending > div {
  height: 100%;
  display: flex;
  flex-direction: column;
}

.wp-jobs.pending .wp-note {
  flex: none;
}

.wp-fill {
  flex: 1;
  grid-auto-rows: 1fr;
  align-content: stretch;
}

/* wall homelab — bands distributed across the stage */

.wp-grid {
  height: 100%;
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  grid-auto-rows: min-content;
  grid-template-rows: none;
  gap: 8px;
  align-content: space-between;
}

.wp-pools {
  grid-column: span 12;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px 24px;
}

.wp-guests,
.wp-smart,
.wp-fleet {
  grid-column: span 12;
}

.wp-strip {
  grid-column: span 12;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}

.wp-grid.pending {
  grid-template-rows: auto 1fr;
}

/* wall services — groups distributed, no dead band */

.wp-matrix {
  height: 100%;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  gap: 12px;
  justify-content: space-between;
}

.wp-matrix.pending {
  justify-content: flex-start;
}

.wp-matrix.pending .wp-fill {
  flex: 1;
  margin-top: 12px;
}

/* wall media + personal — top cells band, two stretched lists below */

.wp-mp {
  height: 100%;
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-height: 0;
}

.wp-mp-cols {
  flex: 1 1 auto;
  min-height: 0;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0 40px;
}

.wp-mp-cols > div {
  display: flex;
  flex-direction: column;
  min-height: 0;
}

.wp-list {
  display: flex;
  flex-direction: column;
  flex: 1;
  min-height: 0;
  border-top: 1px solid var(--fine);
}

.wp-list .wrow {
  flex: 1 1 auto;
  min-height: 44px;
}

.wp-note {
  font-family: var(--mono);
  font-size: 14px;
  color: var(--muted);
  border: 1px dashed var(--line);
  border-radius: 2px;
  padding: 14px 16px;
}

.wall .cell-v {
  font-size: clamp(30px, 3.2vw, 44px);
}

/* ---------- responsive ---------- */

@media (max-width: 980px) {
  .subgrid.cols-3 {
    grid-template-columns: 1fr 1fr;
  }
  .wp-kpis {
    grid-template-columns: repeat(4, 1fr);
  }
}

@media (max-width: 760px) {
  :root {
    --header: 116px;
  }
  .hdr {
    height: auto;
    min-height: var(--header);
    flex-wrap: wrap;
    padding: 10px 0;
  }
  .hdr-in {
    flex-wrap: wrap;
    gap: 8px 12px;
  }
  .tabs {
    order: 3;
    width: 100%;
    justify-content: flex-start;
    overflow-x: auto;
    flex-wrap: nowrap;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    margin: 4px 0 0;
    padding-bottom: 2px;
  }
  .tabs::-webkit-scrollbar {
    display: none;
  }
  .hdr-r {
    margin-left: auto;
    gap: 8px;
  }
  .updated {
    display: none;
  }
  .subgrid.cols-2,
  .subgrid.cols-3 {
    grid-template-columns: 1fr;
  }
  .wp-jobs,
  .wp-pools,
  .wp-strip,
  .wp-mp-cols {
    grid-template-columns: 1fr;
  }
  .wp-kpis {
    grid-template-columns: repeat(2, 1fr);
  }
  .wall-stage {
    margin: 16px;
  }
  .wall-hdr,
  .wall-rail {
    padding: 0 16px;
  }
}

/* phones: cards stack to one column, header actions hit 40px tap height */

@media (max-width: 559px) {
  .hero,
  .cells {
    grid-template-columns: 1fr;
  }
  .hdr-r {
    min-height: 40px;
    align-items: center;
  }
  .theme-btn {
    min-height: 40px;
    padding: 8px 14px;
  }
}

@media (max-width: 420px) {
  .hero {
    grid-template-columns: 1fr;
  }
}

/* components.css — Cell, Row, Bar, Spark, Matrix, Pill, Timeline, Banner,
   pending / empty / error states. All colors via tokens only. */

/* ---------- Pill ---------- */

.pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: 1px solid var(--line);
  border-radius: 2px;
  padding: 3px 8px;
  font-family: var(--mono);
  font-size: 10.5px;
  font-weight: 500;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--soft);
  background: none;
}

.pill i {
  width: 6px;
  height: 6px;
  flex: none;
  background: var(--muted);
}

.pill.live {
  color: var(--cyan);
  border-color: var(--cyan);
}

.pill.live i {
  background: var(--cyan);
}

.pill.seed {
  color: var(--soft);
}

.pill.seed i {
  background: var(--muted);
}

.pill.snapshot {
  color: var(--muted);
}

.pill.snapshot i {
  background: var(--muted);
}

.pill.stale {
  color: var(--warn);
  border-color: var(--warn);
}

.pill.stale i {
  background: var(--warn);
}

/* ---------- Cell (KPI) ---------- */

.cell {
  border: 1px solid var(--line);
  border-radius: 2px;
  background: color-mix(in srgb, var(--surface) 72%, transparent);
  padding: 15px 16px 16px;
  min-height: 86px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 0;
}

.cell-l {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
}

.cell-v {
  font-family: var(--mono);
  font-size: 26px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  color: var(--text);
  line-height: 1.1;
  overflow-wrap: anywhere;
}

.cell-v small {
  font-size: 13px;
  font-weight: 500;
  color: var(--muted);
}

.cell-v.good {
  color: var(--cyan);
}

.cell-v.warn {
  color: var(--warn);
}

.cell-v.bad {
  color: var(--bad);
}

.cell-s {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--soft);
  margin-top: auto;
  overflow-wrap: anywhere;
}

/* stacked sub-items: inline with · separators on wide screens, one per line
   on narrow ones — no orphan separator can wrap alone */
.slist {
  display: inline;
}

.slist + .slist::before {
  content: " · ";
}

.cell-s .warn {
  color: var(--warn);
}

/* ---------- dot ---------- */

.dot {
  width: 6px;
  height: 6px;
  flex: none;
  display: inline-block;
}

.dot.good {
  background: var(--cyan);
}

.dot.warn {
  background: var(--warn);
}

.dot.bad {
  background: var(--bad);
}

.dot.off {
  background: var(--muted);
}

/* ---------- Row (table row / button row) ---------- */

.trows {
  border-top: 1px solid var(--fine);
}

.row {
  display: grid;
  grid-template-columns: 1fr 160px;
  gap: 2px 16px;
  align-items: center;
  width: 100%;
  text-align: left;
  padding: 11px 10px;
  border: 0;
  border-bottom: 1px solid var(--fine);
  background: none;
  color: var(--text);
  cursor: pointer;
}

.row[disabled] {
  cursor: default;
}

.row:hover:not([disabled]) {
  background: color-mix(in srgb, var(--surface) 85%, transparent);
}

.row.fail {
  border-left: 2px solid var(--bad);
}

.row .rmain {
  min-width: 0;
}

.row .rtitle {
  font-size: 15px;
  font-weight: 500;
  color: var(--text);
  overflow-wrap: anywhere;
}

.row .rmeta {
  font-size: 13px;
  font-weight: 400;
  color: var(--soft);
  margin-top: 2px;
  overflow-wrap: anywhere;
}

.row .rmeta .m {
  color: var(--muted);
}

.row .rmeta .bad {
  color: var(--bad);
}

.row .rright {
  grid-column: 2;
  grid-row: 1 / span 2;
  display: flex;
  align-items: baseline;
  justify-content: flex-end;
  gap: 8px;
  text-align: right;
  font-family: var(--mono);
  font-size: 12.5px;
  font-weight: 400;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  overflow: hidden;
}

.row .rright .st {
  display: inline;
  margin-top: 0;
}

.row .rright .st.good {
  color: var(--cyan);
}

.row .rright .st.warn {
  color: var(--warn);
}

.row .rright .st.bad {
  color: var(--bad);
}

.tag {
  display: inline-block;
  border: 1px solid var(--line);
  border-radius: 2px;
  padding: 1px 5px;
  font-family: var(--mono);
  font-size: 10.5px;
  line-height: 1.3;
  letter-spacing: 0.04em;
  color: var(--soft);
  white-space: nowrap;
  margin-right: 4px;
  vertical-align: 1px;
}

.tag.warn {
  color: var(--warn);
  border-color: color-mix(in srgb, var(--warn) 45%, transparent);
}

/* ---------- Spark (7-day success strip) ---------- */

.spark {
  display: inline-flex;
  align-items: flex-end;
  gap: 2px;
  height: 14px;
  vertical-align: middle;
}

.spark i {
  width: 6px;
  height: 14px;
  background: var(--fine);
}

.spark i.f {
  background: var(--cyan);
}

.spark i.p {
  background: color-mix(in srgb, var(--warn) 70%, transparent);
}

.spark i.x {
  background: var(--bad);
}

/* 0-run window: 2px muted stub, not a full-height bar */
.spark i.z,
.spark.nodata i {
  height: 2px;
  background: var(--muted);
}

/* ---------- Bar ---------- */

.bar {
  border: 1px solid var(--line);
  border-radius: 2px;
  height: 6px;
  background: var(--surface-2);
  overflow: hidden;
  margin-top: 6px;
}

.bar i {
  display: block;
  height: 100%;
  background: var(--cyan);
}

.bar i.warn {
  background: var(--warn);
}

.bar i.bad {
  background: var(--bad);
}

.barline {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
}

.barline .bl {
  font-family: var(--mono);
  font-size: 11.5px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--soft);
}

.barline .bv {
  font-family: var(--mono);
  font-size: 12.5px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.barline .bv.warn {
  color: var(--warn);
}

.barline .bv.bad {
  color: var(--bad);
}

/* ---------- Matrix (chips) ---------- */

.matrix {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(158px, 1fr));
  gap: 6px;
}

.chip {
  border: 1px solid var(--fine);
  border-radius: 2px;
  padding: 6px 9px;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
  background: color-mix(in srgb, var(--surface) 55%, transparent);
}

.chip .cn {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.chip .cs {
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--muted);
  margin-left: auto;
  white-space: nowrap;
}

.chip .cs.off {
  color: var(--muted);
}

.chip .cs.bad {
  color: var(--bad);
}

.chip.stopped-expected {
  border-color: color-mix(in srgb, var(--warn) 55%, transparent);
}

.chip.stopped-expected .cs {
  color: var(--warn);
}

.mxgroup {
  margin-bottom: 14px;
  min-width: 0;
}

.mxgroup .gx {
  font-family: var(--mono);
  font-size: 10.5px;
  font-weight: 500;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 6px;
  display: flex;
  gap: 8px;
  align-items: baseline;
}

.mxgroup .gx .gc {
  font-weight: 400;
  color: var(--soft);
}

/* ---------- Timeline ---------- */

.tl {
  position: relative;
  padding-left: 18px;
  border-left: 2px solid var(--fine);
}

.tl-row {
  position: relative;
  display: grid;
  grid-template-columns: auto auto 1fr;
  gap: 10px;
  align-items: baseline;
  width: 100%;
  text-align: left;
  padding: 9px 4px;
  border: 0;
  border-bottom: 1px solid var(--fine);
  background: none;
  color: var(--text);
  cursor: pointer;
}

.tl-row:hover {
  background: color-mix(in srgb, var(--surface) 85%, transparent);
}

.tl-row .node {
  position: absolute;
  left: -23px;
  top: 13px;
  width: 8px;
  height: 8px;
  background: var(--muted);
}

.tl-row .node.info {
  background: var(--cyan);
}

.tl-row .node.warn {
  background: var(--warn);
}

.tl-row .node.bad {
  background: var(--bad);
}

.tl-row .t {
  font-family: var(--mono);
  font-size: 11.5px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.tl-row .x {
  font-size: 14px;
  color: var(--text);
  overflow-wrap: anywhere;
}

/* ---------- Banner ---------- */

.banner {
  border-top: 1px solid var(--line);
  border-left: none;
  border-right: none;
  border-bottom: none;
  background: var(--surface);
  padding: 8px 12px;
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: var(--mono);
  font-size: 12px;
  color: var(--soft);
}

.banner i {
  width: 6px;
  height: 6px;
  flex: none;
  background: var(--cyan);
}

.banner.warn {
  border-top-color: var(--warn);
  color: var(--warn);
}

.banner.warn i {
  background: var(--warn);
}

/* muted variant: mode banners (seed / snapshot) — informational, never an alarm */
.banner.mute {
  border-top-color: var(--line);
  color: var(--soft);
}

.banner.mute i {
  background: var(--muted);
}

.banner.bad {
  border-top-color: var(--bad);
  color: var(--bad);
}

.banner.bad i {
  background: var(--bad);
}

/* ---------- states: pending / empty / error / stale ---------- */

.state {
  border: 1px dashed var(--line);
  border-radius: 2px;
  padding: 18px 16px;
  margin: 6px 0;
  font-family: var(--mono);
  font-size: 12.5px;
  color: var(--muted);
  display: flex;
  align-items: baseline;
  gap: 10px;
  flex-wrap: wrap;
}

.state .t {
  color: var(--soft);
}

.state.pending .t::after {
  content: " · collector pending · v2 not wired";
  color: var(--muted);
}

.state.error {
  border-style: solid;
  border-color: color-mix(in srgb, var(--bad) 45%, transparent);
}

.state.error .t {
  color: var(--bad);
}

.state.stale {
  border-color: color-mix(in srgb, var(--warn) 45%, transparent);
}

.state.stale .t::after {
  content: " · stale";
  color: var(--warn);
}

.nodata {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--muted);
}

.dash {
  color: var(--muted);
}

/* ---------- filter chips ---------- */

.chips {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin: 10px 0 12px;
}

.fchip {
  border: 1px solid var(--line);
  border-radius: 2px;
  background: none;
  padding: 4px 9px;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--soft);
  cursor: pointer;
}

.fchip[aria-pressed="true"] {
  color: var(--cyan);
  border-color: var(--cyan);
}

/* ---------- kv table (drawer) ---------- */

.kv {
  width: 100%;
  border-collapse: collapse;
}

.kv td {
  border-bottom: 1px solid var(--fine);
  padding: 7px 4px;
  vertical-align: top;
  font-size: 12.5px;
}

.kv td.k {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--muted);
  width: 38%;
  padding-right: 10px;
}

.kv td.v {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--text);
  overflow-wrap: anywhere;
}

.kv td.v .dash {
  color: var(--muted);
}

/* ---------- phone overrides ---------- */
/* This sheet loads after layout.css, so component-owned overrides must live
   here to win the cascade. Phones: sub-items stack as a list (no orphan
   separator), secondary text ≥ 12px, pill hits 40px, rows keep one line. */

@media (max-width: 559px) {
  .hdr-r .pill {
    min-height: 40px;
    align-items: center;
    padding: 5px 9px;
  }
  .cell-s {
    font-size: 12px;
  }
  .slist {
    display: block;
    line-height: 1.5;
  }
  .slist + .slist::before {
    content: "";
  }
  .row {
    grid-template-columns: 1fr 140px;
  }
}

/* components.js — pure string renderers for the BRIEF §6 component set.
   Everything renders only from the payload; missing values become —. */

const esc = (v) =>
  String(v ?? "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));

/* Safe getters: g(obj, "a.b.c") → value or undefined. */
const g = (obj, path) =>
  path.split(".").reduce((o, k) => (o == null ? undefined : o[k]), obj);

/* A number, or null (never NaN). */
const num = (v) => (typeof v === "number" && Number.isFinite(v) ? v : null);

/* Payload value → display string; missing → em dash, never invented. */
const val = (v) => (v === undefined || v === null || v === "" ? "—" : esc(v));

const valNum = (v, suffix = "") => {
  const n = num(v);
  return n === null ? '<span class="dash">—</span>' : esc(n.toLocaleString("en-US") + suffix);
};

/* ---- Pill ---- */
function pill(kind, text) {
  return `<span class="pill ${kind}" data-pill>${text}<i></i></span>`;
}

/* ---- Cell ---- */
function cell({ label, value = "—", sub = "", state = "", small = "" }) {
  const v = value === "—" ? '<span class="dash">—</span>' : value;
  return `<div class="cell">
    <span class="cell-l">${esc(label)}</span>
    <span class="cell-v ${state}">${v}${small ? `<small> ${esc(small)}</small>` : ""}</span>
    ${sub ? `<span class="cell-s">${sub}</span>` : ""}
  </div>`;
}

/* ---- dot ---- */
function dot(state, extra = "") {
  return `<i class="dot ${state} ${extra}" aria-hidden="true"></i>`;
}

/* ---- Spark: 7-day success strip — 6×14 vertical bars, 2px gap, cyan.
   Aggregate rate only (no per-day breakdown in the payload, never invented);
   a 0-run window renders 2px muted stubs. ---- */
function sparkBars(success, runs) {
  const s = num(success);
  if (s === null) {
    return `<span class="spark nodata" title="no runs recorded in 7d">${"<i></i>".repeat(7)}</span>`;
  }
  if (num(runs) === 0) {
    return `<span class="spark" title="no runs in the last 7 days">${'<i class="z"></i>'.repeat(7)}</span>`;
  }
  const cls = s >= 100 ? "f" : s >= 50 ? "p" : "x";
  return `<span class="spark" title="7-day success ${s}%">${`<i class="${cls}"></i>`.repeat(7)}</span>`;
}

/* ---- Bar: 6px, cyan / amber > 80 / red > 90 ---- */
function bar({ label, pct, value = "", right = "" }) {
  const p = num(pct);
  const cls = p === null ? "" : p > 90 ? "bad" : p > 80 ? "warn" : "";
  const vcls = p === null ? "" : p > 90 ? "bad" : p > 80 ? "warn" : "";
  return `<div class="barwrap">
    <div class="barline"><span class="bl">${esc(label)}</span><span class="bv ${vcls}">${valNum(p, "%")} ${value}</span></div>
    <div class="bar" role="img" aria-label="${esc(label)} ${p === null ? "no data" : p + " percent"}">
      <i class="${cls}" style="width:${p === null ? 0 : Math.max(0, Math.min(100, p))}%"></i>
    </div>
    ${right ? `<div class="nodata" style="margin-top:4px">${right}</div>` : ""}
  </div>`;
}

/* ---- Row ---- */
function row({ title, meta = "", right = "", fail = false, disabled = false, drawer = "" }) {
  return `<${disabled ? "div" : "button"} class="row${fail ? " fail" : ""}" ${disabled ? 'aria-disabled="true"' : `data-drawer="${esc(drawer)}"`}>
    <span class="rmain">
      <span class="rtitle">${title}</span>
      ${meta ? `<span class="rmeta">${meta}</span>` : ""}
    </span>
    ${right ? `<span class="rright">${right}</span>` : ""}
  </${disabled ? "div" : "button"}>`;
}

/* ---- Matrix chip ---- */
function chip({ name, state = "off", right = "", cls = "" }) {
  return `<span class="chip ${cls}" title="${esc(name)}">
    ${dot(state)}
    <span class="cn">${esc(name)}</span>
    ${right ? `<span class="cs">${right}</span>` : ""}
  </span>`;
}

/* ---- Timeline row ---- */
function tlRow(ev, idx) {
  const lvl = ["info", "warn", "bad"].includes(ev.level) ? ev.level : "info";
  return `<button class="tl-row" data-drawer="tl:${idx}">
    <i class="node ${lvl}" aria-hidden="true"></i>
    <span class="t">${esc(fmtTimeShort(ev.ts))}</span>
    <span class="tag">${val(ev.source)}</span>
    <span class="x">${val(ev.text)}</span>
  </button>`;
}

/* ---- Banner ---- */
function banner(level, text, right = "") {
  return `<div class="banner ${level}" role="status">
    <i aria-hidden="true"></i><span>${esc(text)}</span>${right ? `<span style="margin-left:auto">${esc(right)}</span>` : ""}
  </div>`;
}

/* ---- state panels: pending / empty / error ---- */
function pendingPanel(what, note = "") {
  return `<div class="state pending" data-state="pending"><span class="t">${esc(what)}</span>${note ? `<span>${esc(note)}</span>` : ""}</div>`;
}

function emptyPanel(what) {
  return `<div class="state" data-state="empty"><span class="t">${esc(what)}</span><span>nothing in the current window</span></div>`;
}

function errorPanel(what, err) {
  return `<div class="state error" data-state="error"><span class="t">${esc(what)}</span><span>${esc(err || "source error")}</span></div>`;
}

/* ---- freshness badge for a section hint ---- */
function sourceBadge(name, sources) {
  const s = (sources || []).find((x) => x && x.name === name);
  if (!s) return `<span class="nodata">${esc(name)} · no source info</span>`;
  if (s.pending) return `<span class="nodata">${esc(name)} · collector pending</span>`;
  if (s.ok === false) return `<span class="nodata" style="color:var(--bad)">${esc(name)} · error ${esc(s.error || "failed")}</span>`;
  const age = num(s.age_s);
  if (s.stale) return `<span class="nodata" style="color:var(--warn)">${esc(name)} · stale ${age === null ? "" : fmtDur(age)}</span>`;
  const ms = num(s.ms);
  return `<span class="nodata">${esc(name)} · ${ms === null ? "ok" : ms + "ms"}</span>`;
}

/* ---- time formatting (all display, no invention) ---- */
const DAY_NAMES = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];
const MON_NAMES = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];

function parseTs(ts) {
  if (!ts) return null;
  const d = new Date(ts);
  return Number.isNaN(d.getTime()) ? null : d;
}

function fmtClock(d) {
  const p = (n) => String(n).padStart(2, "0");
  return `${p(d.getHours())}:${p(d.getMinutes())}`;
}

function fmtTimeShort(ts) {
  const d = parseTs(ts);
  if (!d) return "—";
  const now = new Date();
  const t = fmtClock(d);
  if (d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth() && d.getDate() === now.getDate()) {
    return t;
  }
  return `${t} · ${MON_NAMES[d.getMonth()]} ${String(d.getDate()).padStart(2, "0")}`;
}

function fmtWallDate(d) {
  return `${DAY_NAMES[d.getDay()]} ${String(d.getDate()).padStart(2, "0")} ${MON_NAMES[d.getMonth()]}`;
}

function fmtDur(seconds) {
  const s = num(seconds);
  if (s === null) return "—";
  if (s < 60) return `${Math.max(0, Math.round(s))}s`;
  if (s < 3600) return `${Math.round(s / 60)}m`;
  if (s < 86400) return `${Math.round(s / 3600)}h`;
  return `${Math.round(s / 86400)}d`;
}

function fmtUptime(seconds) {
  const s = num(seconds);
  if (s === null) return "—";
  const d = Math.floor(s / 86400);
  const h = Math.floor((s % 86400) / 3600);
  const m = Math.floor((s % 3600) / 60);
  return d > 0 ? `${d}d ${h}h` : h > 0 ? `${h}h ${m}m` : `${m}m`;
}

function fmtNextRun(ts) {
  const d = parseTs(ts);
  if (!d) return "—";
  return `${fmtClock(d)} ${MON_NAMES[d.getMonth()]} ${String(d.getDate()).padStart(2, "0")}`;
}

/* "updated 12s ago" style, from the payload's generated_at */
function fmtAge(ts, now = Date.now()) {
  const d = parseTs(ts);
  if (!d) return "—";
  const age = Math.max(0, (now - d.getTime()) / 1000);
  return fmtDur(age);
}

/* kb table for the drawer: raw key/value dump of an object */
function kvTable(obj) {
  const rows = Object.entries(obj || {})
    .map(([k, v]) => {
      const raw = v === null ? "null" : v === undefined ? "undefined" : typeof v === "object" ? JSON.stringify(v) : String(v);
      return `<tr><td class="k">${esc(k)}</td><td class="v">${esc(raw)}</td></tr>`;
    })
    .join("");
  return rows ? `<table class="kv">${rows}</table>` : `<div class="nodata">no raw fields</div>`;
}

/* app.js — boot, data loading (live v1 → adapted v2, seed fallback),
   web layout, drawer, filters, keyboard, URL state, theme.
   Wall mode lives in wall.js; boot() is invoked at the end of wall.js. */

const AUTH_DATA = "/dashboard/data"; // authenticated v1 snapshot (Vercel function)
const WALL_DATA = "./dashboard.json"; // wall server payload (docker-vm)
const SEED = window.__DASHBOARD_SEED__; // fixture inlined by the build
const LIVE_TIMEOUT_MS = 5000;
const REFRESH_MS = 60000;

const SECTIONS = [
  ["automations", "Automations"],
  ["homelab", "Homelab"],
  ["services", "Services"],
  ["media", "Media"],
  ["personal", "Personal"],
  ["timeline", "Timeline"],
];

const S = {
  source: "sync", // "sync" | "public" | "snapshot" | "live" | "seed" | "stale" | "error"
  data: null, // v2-shaped payload (seed fixture or adapted live v1)
  params: {},
  theme: "dark",
  filters: { automations: "all", tlLevel: "all", tlSource: "all" },
  mem: {}, // per-render arrays for the drawer
  lastLiveOk: null,
  wall: false,
};

/* ---------- URL params ---------- */

function parseParams() {
  const q = new URLSearchParams(location.search);
  S.params = {
    mode: q.get("mode") || "",
    section: q.get("section") || "",
    filter: q.get("filter") || "all",
    level: q.get("level") || "all",
    src: q.get("src") || "all",
    theme: q.get("theme") || "",
    page: q.get("page"),
    fixture: q.has("fixture") || q.has("specimen"),
    dwell: q.get("dwell"),
  };
  if (["all", "failing", "script", "agent"].includes(S.params.filter)) S.filters.automations = S.params.filter;
  if (["all", "info", "warn", "bad"].includes(S.params.level)) S.filters.tlLevel = S.params.level;
  if (S.params.src !== "all") S.filters.tlSource = S.params.src;
  if (S.params.theme === "light" || S.params.theme === "dark") S.theme = S.params.theme;
}

function setParam(key, value) {
  const q = new URLSearchParams(location.search);
  if (value === null || value === "" || value === "all") q.delete(key);
  else q.set(key, value);
  const s = q.toString();
  history.replaceState(null, "", `${location.pathname}${s ? "?" + s : ""}${location.hash}`);
}

/* ---------- v1 → v2 adapter (live payload, honest mapping only) ---------- */

function adaptV1(v1) {
  if (!v1 || typeof v1 !== "object") throw new Error("bad payload");
  const h = v1.hermes || {};
  const hl = v1.homelab || {};
  const now = v1.now || {};

  const hermes = {
    version: h.version ?? null,
    released: h.released ?? null,
    commits_behind: h.commits_behind ?? null,
    cron: {
      total: h.cron_total ?? null,
      enabled: h.cron_active ?? null,
      no_agent: h.cron_no_agent ?? null,
      failing: h.cron_failing_count ?? 0,
    },
    skills: h.skills ?? null,
    mcp_servers: h.mcp_servers ?? null,
    memory: h.memory ?? null,
    disk: h.disk ?? null,
    tokens: h.tokens ?? null,
  };

  const p520 = {
    host: hl.host ?? null,
    guests: (hl.guests || []).map((x) => ({
      id: x.id ?? null,
      name: x.name ?? null,
      type: x.type ?? null,
      status: x.status ?? null,
      mem_mb: x.mem_mb ?? null,
      disk_gb: x.disk_gb ?? null,
    })),
    pools: hl.pools ?? null,
    backups: hl.backups ?? null,
    snapshots: hl.snapshots ?? null,
    scrub_timers: hl.scrub_timers ?? null,
    gpu: hl.gpu
      ? { owner: hl.gpu.owner_name ?? null, owner_vm: hl.gpu.owner_vm ?? null, mode: hl.gpu.mode ?? null }
      : null,
    reachable: hl.reachable ?? null,
  };

  const journalIn7 = (v1.journal || []).filter((e) => {
    if (!e || !e.date || !v1.generated_at) return false;
    const d = new Date(e.date);
    const gen = new Date(v1.generated_at);
    return !Number.isNaN(d) && !Number.isNaN(gen) && (gen - d) / 86400000 <= 7;
  });

  const personal = {
    tasks: v1.tasks
      ? { open: v1.tasks.open ?? null, overdue: v1.tasks.overdue ?? null, items: v1.tasks.items || [] }
      : null,
    school: v1.school
      ? { upcoming: v1.school.upcoming ?? null, courses: v1.school.courses || [], next: v1.school.next || [] }
      : null,
    journal: {
      entries_7d: journalIn7.length,
      last: v1.journal && v1.journal[0] ? v1.journal[0].date : null,
    },
    listening: now,
  };

  const fleet = (v1.fleet || []).map((p) => ({
    name: p.name ?? null,
    os: p.os ?? null,
    online: p.online ?? null,
    self: p.self ?? false,
  }));
  const online = fleet.filter((p) => p.online).length;

  const alerts = (num(now.jobs_failing) || 0) + (num(now.homelab_issues_bad) || 0) + (num(now.overdue_tasks) || 0);
  const overall = {
    status:
      (num(now.jobs_failing) || 0) > 0 || (num(now.homelab_issues_bad) || 0) > 0
        ? "bad"
        : alerts > 0 || (num(now.homelab_issues_warn) || 0) > 0
          ? "warn"
          : "ok",
    alerts,
    derived: true,
  };

  const STACKS = (n) => {
    if (/^(sonarr|radarr|prowlarr|bazarr|cleanuparr|jellyseerr|jellyfin|qbittorrent|flaresolverr|gluetun|navidrome|audiobookshelf|suwayomi|calibre-web|kamiyomu|syncthing)/.test(n)) return "media";
    if (/^immich/.test(n)) return "photos";
    if (/^paperless/.test(n)) return "docs";
    if (["forgejo", "code-server", "caddy", "dozzle", "diun"].includes(n)) return "dev";
    if (["homeassistant", "node-red", "mosquitto"].includes(n)) return "home";
    if (["uptime-kuma", "grafana", "prometheus", "scrutiny", "scrutiny-influxdb", "healthchecks", "healthchecks-db", "ntfy", "dashboard-wall"].includes(n)) return "ops";
    if (/^miniflux/.test(n)) return "reading";
    if (n === "actual") return "finance";
    if (n === "vaultwarden") return "security";
    if (["open-webui", "qdrant", "ollama-cpu"].includes(n)) return "ai";
    if (n === "stirling-pdf") return "tools";
    return "other";
  };

  const containerNames = hl.containers?.names || [];
  const dockerVm = hl.containers
    ? {
        counts: {
          defined: hl.containers.total ?? null,
          running: hl.containers.running ?? null,
          stopped:
            hl.containers.total !== null && hl.containers.total !== undefined &&
            hl.containers.running !== null && hl.containers.running !== undefined
              ? hl.containers.total - hl.containers.running
              : null,
          expected_running_stopped: null,
          unhealthy: (hl.containers.unhealthy || []).length,
        },
        containers: containerNames.map((n) => ({ name: n, state: "running", stack: STACKS(n), health: null })),
        stacks: [...new Set(containerNames.map(STACKS))].sort(),
      }
    : { pending: true };

  const media = hl.media
    ? {
        queues: { radarr: hl.media.radarr_queue ?? null, sonarr: hl.media.sonarr_queue ?? null },
        downloads: {
          active: hl.media.torrents_active ?? null,
          rate_mbps: hl.media.down_mbps ?? null,
          torrents: hl.media.torrents ?? null,
        },
        jellyfin: {
          movies: hl.media.jellyfin_movies ?? null,
          series: hl.media.jellyfin_series ?? null,
          episodes: hl.media.jellyfin_episodes ?? null,
        },
        mount: hl.media.mount_free ?? null,
      }
    : { pending: true };

  const sources = [
    { name: "hermes", ok: true, ms: null, stale: false, age_s: 0 },
    { name: "proxmox", ok: hl.reachable !== false, ms: null, stale: hl.reachable === false, age_s: 0, error: hl.reachable === false ? "unreachable" : null },
    { name: "network", ok: true, ms: null, stale: false, age_s: 0 },
    { name: "personal", ok: true, ms: null, stale: false, age_s: 0 },
    { name: "docker_stack", ok: !!hl.containers, ms: null, stale: false, age_s: 0, pending: !hl.containers },
    { name: "media", ok: !!hl.media, ms: null, stale: false, age_s: 0, pending: !hl.media },
    { name: "external", ok: false, ms: null, stale: false, age_s: 0, pending: true, error: "v1 payload has no external surface" },
  ];

  return {
    schema: "ayumad.dashboard/2",
    adapted_from: "v1",
    generated_at: v1.generated_at ?? null,
    generated_on: v1.generated_on ?? null,
    overall,
    surfaces: {
      mac_mini: {
        hermes,
        cron: { pending: true }, // per-job cron rows are not present in v1
      },
      p520,
      docker_vm: dockerVm,
      network: { tailscale: fleet, online, pihole: null, routes: null },
      media,
      personal,
      external: { pending: true },
    },
    timeline: timelineFromV1(v1),
    meta: { sources, kiosk: null, build_ms: null },
  };
}

function timelineFromV1(v1) {
  const ev = [];
  for (const f of (g(v1, "hermes.cron_failing") || [])) {
    if (!f) continue;
    ev.push({
      ts: f.last ?? null,
      level: num(f.ok) === 0 ? "bad" : "warn",
      source: "cron",
      text: `${val(f.name)} — ${num(f.ok) ?? "?"}/${num(f.runs) ?? "?"} ok in window`,
    });
  }
  if (g(v1, "homelab.reachable") === false) {
    ev.push({ ts: g(v1, "homelab.checked_at") ?? null, level: "bad", source: "proxmox", text: "P520 unreachable at last check" });
  } else if (g(v1, "homelab.checked_at")) {
    ev.push({ ts: g(v1, "homelab.checked_at"), level: "info", source: "proxmox", text: "homelab check ok" });
  }
  const nb = g(v1, "homelab.backups");
  if (nb && nb.newest) {
    ev.push({ ts: g(v1, "homelab.checked_at") ?? null, level: "info", source: "backup", text: `newest vzdump ${val(nb.newest_age_h)}h old` });
  }
  for (const j of (v1.journal || []).slice(0, 5)) {
    if (!j || !j.date) continue;
    ev.push({ ts: j.date, level: "info", source: "journal", text: String(j.summary || "").slice(0, 120) || "journal entry" });
  }
  for (const [k, v] of Object.entries(v1.errors || {})) {
    ev.push({ ts: v1.generated_at ?? null, level: "bad", source: k, text: String(v).slice(0, 120) });
  }
  return ev
    .filter((e) => e.ts)
    .sort((a, b) => new Date(b.ts) - new Date(a.ts))
    .slice(0, 50);
}

/* ---------- data loading ---------- */
/* Load order: authenticated snapshot (/dashboard/data) → wall live payload
   (./dashboard.json) → embedded seed (wall / file:// / ?fixture=1).
   Behind auth, a failed snapshot is an error state, never fake seed data. */

async function fetchJson(url, timeoutMs) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs);
  try {
    const res = await fetch(url, { cache: "no-store", credentials: "same-origin", signal: ctrl.signal });
    if (!res.ok) {
      const err = new Error(`HTTP ${res.status}`);
      err.status = res.status;
      throw err;
    }
    return await res.json();
  } finally {
    clearTimeout(timer);
  }
}

function useSeed() {
  S.data = SEED;
  S.source = "seed";
}

async function loadData() {
  if (S.params.fixture) {
    useSeed();
    render();
    return;
  }
  try {
    const raw = await fetchJson(AUTH_DATA, LIVE_TIMEOUT_MS);
    S.data = adaptV1(raw);
    S.source = raw.public ? "public" : "snapshot";
    S.lastLiveOk = new Date();
  } catch (err) {
    if (err.status === 401 && location.protocol !== "file:") {
      location.href = "/dashboard/login?next=" + encodeURIComponent(location.pathname);
      return;
    }
    try {
      S.data = adaptV1(await fetchJson(WALL_DATA, LIVE_TIMEOUT_MS));
      S.source = "live";
      S.lastLiveOk = new Date();
    } catch {
      if (S.data) {
        S.source = "stale"; // keep last good data, say so
      } else if (location.protocol === "file:" || S.wall) {
        useSeed();
      } else {
        S.data = null;
        S.source = "error";
      }
    }
  }
  render();
}

/* ---------- shared header bits ---------- */

function pillFor(source) {
  if (source === "live") return pill("live", "LIVE · partial");
  if (source === "public") return pill("seed", "PUBLIC · read-only");
  if (source === "snapshot") return pill("snapshot", "SNAPSHOT · partial");
  if (source === "seed") return pill("seed", "SEED");
  if (source === "stale") return pill("stale", "STALE");
  if (source === "error") return pill("stale", "NO DATA");
  return pill("seed", "SYNC");
}

/* Global mode banner (web): honest about what is on screen.
   SEED → design fixture note · SNAPSHOT → snapshot + age · LIVE → nothing. */
function modeBannerHtml() {
  if (!S.data) return S.source === "error" ? banner("warn", "DATA UNAVAILABLE · snapshot could not be read") : "";
  if (S.source === "public") return banner("mute", "PUBLIC VIEW · read-only · sign in for full detail");
  if (S.source === "seed") return banner("mute", "DESIGN FIXTURE · not live data");
  if (S.source === "snapshot") {
    return banner("mute", `snapshot · ${fmtAge(g(S.data, "generated_at"))} old`);
  }
  return "";
}

/* ---------- web render ---------- */

const app = document.getElementById("app");

function render() {
  document.documentElement.dataset.theme = S.theme;
  if (S.wall) {
    if (typeof wallRender === "function") wallRender();
    return;

  renderWeb();
}

function statusWord(st) {
  return st === "ok" ? "OK" : st === "warn" ? "ATTENTION" : st === "bad" ? "FAULT" : "—";
}

function heroCells() {
  if (!S.data) {
    return ["status", "alerts", "jobs", "containers", "devices", "tasks"]
      .map((l) => cell({ label: l, value: '<span class="dash">…</span>', sub: "syncing" }))
      .join("");

  const o = g(S.data, "overall") || {};

  const failing = num(cron.failing);
  const cts = g(S.data, "surfaces.docker_vm.counts") || null;
  const alerts = num(o.alerts);
  const st = o.status === undefined ? null : o.status;
  const score = num(o.score);
  return [
    cell({
      label: "status",

    cell({

  ].join("");
}

function headerHtml() {

function sectionAutomations() {
  const src = (g(S.data, "meta.sources") || []);
  const h = g(S.data, "surfaces.mac_mini.hermes") || {};
  const cron = h.cron || {};
  const jobs = g(S.data, "surfaces.mac_mini.cron.jobs");
  const pend = g(S.data, "surfaces.mac_mini.cron.pending");
  const launchd = g(S.data, "surfaces.mac_mini.launchd");
  const ports = g(S.data, "surfaces.mac_mini.ports");
  const hint = `${sourceBadge("hermes", src)}${pend ? `<span class="nodata">· rows pending v2</span>` : jobs ? `<span class="nodata">· ${jobs.length} jobs</span>` : ""}`;

  let cells = "";
  if (S.data) {
    const disk = h.disk || {};
    const mem = h.memory || {};
    cells = `<div class="cells">

      ${cell({ label: "no agent", value: valNum(cron.no_agent) })}
      ${cell({ label: "skills", value: valNum(h.skills) })}
      ${cell({ label: "memory", value: valNum(mem.working), small: `+ ${num(mem.episodic) ?? "—"} episodic` })}
      ${cell({ label: "disk used", value: valNum(disk.used_pct, "%"), small: `${num(disk.free_gb) ?? "—"} / ${num(disk.size_gb) ?? "—"} GB free`, state: num(disk.used_pct) > 90 ? "bad" : num(disk.used_pct) > 80 ? "warn" : "good" })}
      ${cell({ label: "hermes", value: val(h.version), sub: `released ${val(h.released)} · ${valNum(h.commits_behind)} behind` })}
    </div>`;
  } else {
    cells = pendingPanel("automations summary", "connecting to live source");
  }

  let jobsHtml;
  if (pend) {
    jobsHtml = pendingPanel("per-job cron rows");
  } else if (!jobs || !jobs.length) {
    jobsHtml = emptyPanel("cron jobs");
  } else {
    const list = S.mem.jobs = jobs.slice();
    const flt = S.filters.automations;
    const isFail = (j) =>
      (num(j.success_7d) !== null && j.success_7d < 100) || (j.last_status && j.last_status !== "completed");
    list.sort((a, b) => (isFail(b) ? 1 : 0) - (isFail(a) ? 1 : 0) ||
      (parseTs(a.next_run)?.getTime() ?? Infinity) - (parseTs(b.next_run)?.getTime() ?? Infinity));
    const shown = list
      .map((j, i) => ({ j, i }))
      .filter(({ j }) =>
        flt === "failing" ? isFail(j) : flt === "agent" ? j.no_agent === false : flt === "script" ? j.no_agent === true : true,
      );
    const chips = [
      ["all", "all"], ["failing", `failing ${list.filter(isFail).length}`], ["script", "script"], ["agent", "agent"],
    ]
      .map(([k, l]) => `<button class="fchip" data-filter="${k}" aria-pressed="${flt === k ? "true" : "false"}">${l}</button>`)
      .join("");
    const rows = shown
      .map(({ j, i }) => {
        const stCls = isFail(j) ? "bad" : j.last_status === "completed" ? "good" : "";
        const stTxt = isFail(j) ? "failing" : j.last_status === "completed" ? "ok" : j.last_status ? esc(j.last_status) : "no runs";
        return row({
          title: esc(j.name ?? "—"),
          meta: `${esc(j.schedule ?? "—")} <span class="tag">${esc(j.kind ?? "—")}</span>${j.model ? `<span class="tag">${esc(j.model)}</span>` : ""} ${sparkBars(j.success_7d, j.runs_7d)} <span class="m">${valNum(j.ok_7d)}/${valNum(j.runs_7d)} · 7d</span>`,
          right: `${fmtNextRun(j.next_run)}<span class="st ${stCls}">${stTxt}</span>`,
          fail: isFail(j),
          drawer: `job:${i}`,
        });
      })
      .join("");
    jobsHtml = `<div class="chips" role="group" aria-label="Job filters">${chips}</div>
      <div class="trows">${rows || emptyPanel("jobs matching filter")}</div>`;
  }

  let launchdHtml = "";
  if (launchd && launchd.length) {
    const rows = launchd
      .map((l) =>
        row({
          title: esc(l.label),
          meta: `pid <span class="m">${l.pid === null || l.pid === undefined ? "—" : esc(l.pid)}</span> · last exit <span class="${num(l.last_exit) !== 0 && l.last_exit !== null ? "bad" : "m"}">${valNum(l.last_exit)}</span>`,
          right: `<span class="st ${l.running ? "good" : "off"}">${l.running ? "running" : "stopped"}</span>`,
          disabled: true,
        }),
      )
      .join("");
    launchdHtml = `<div class="subhead">launchd · mac mini</div><div class="trows">${rows}</div>`;
  } else if (S.data) {
    launchdHtml = `<div class="subhead">launchd · mac mini</div><div class="state" data-state="empty"><span class="t">launchd services</span><span>not in v1 payload · pending v2</span></div>`;
  }

  let portsHtml = "";
  if (ports && ports.length) {
    portsHtml = `<div class="subhead">ports · mac mini</div><div class="matrix">${ports
      .map((p) => chip({ name: `${esc(p.name)} · ${valNum(p.port)}`, state: p.state === "listen" ? "good" : "off", right: esc(p.state ?? "—") }))
      .join("")}</div>`;
  } else if (S.data) {
    portsHtml = `<div class="subhead">ports · mac mini</div><div class="state" data-state="empty"><span class="t">listening ports</span><span>not in v1 payload · pending v2</span></div>`;
  }

  return `${secHead("automations", hint)}${cells}
    <div class="subhead">cron jobs · hermes</div>${jobsHtml}
    <div class="subgrid cols-2">
      <div>${launchdHtml}</div>
      <div>${portsHtml}</div>
    </div>
  </section>`;
}

function containerChip(c) {
  const stopped = c.state !== "running";
  if (stopped && c.expected_running === false) {
    return chip({ name: esc(c.name ?? "—"), state: "warn", right: "stopped", cls: "stopped-expected" });
  }
  if (c.health === "unhealthy") return chip({ name: esc(c.name ?? "—"), state: "bad", right: "unhealthy" });
  if (stopped) return chip({ name: esc(c.name ?? "—"), state: "bad", right: "down" });
  return chip({ name: esc(c.name ?? "—"), state: c.health === "healthy" ? "good" : "good", right: c.health === "healthy" ? "healthy" : "up" });
}

function footerHtml() {
  if (!S.data) return "";
  const srcs = g(S.data, "meta.sources") || [];
  const okN = srcs.filter((s) => s.ok).length;
  const stN = srcs.filter((s) => s.stale && s.ok !== false).length;
  const erN = srcs.filter((s) => s.ok === false && !s.pending).length;
  const pdN = srcs.filter((s) => s.pending).length;
  const origin =
    S.source === "seed"
      ? "DESIGN FIXTURE · not live data"
      : S.source === "snapshot"
        ? "adapted from v1 snapshot payload"
        : S.source === "stale"
          ? "adapted from v1 live payload · refresh failing"
          : "adapted from v1 live payload";
  return `<footer class="foot">
    <span>generated ${val(g(S.data, "generated_at"))}</span>
    <span>${val(g(S.data, "generated_on"))}</span>
    <span>${val(g(S.data, "schema"))}</span>
    <span>sources ${okN} ok · ${stN} stale · ${erN} error · ${pdN} pending</span>
    <span>${origin}</span>
  </footer>`;
}

/* ---------- drawer ---------- */

function drawerData(kind, idx) {
  const [table, i] = [kind.split(":")[0], Number(kind.split(":")[1])];
  if (table === "job") return [g(S.mem.jobs, i + ".name") ?? "cron job", S.mem.jobs[i] || {}];
  if (table === "tl") return ["timeline event", S.mem.timeline[i] || {}];
  if (table === "task") return [g(S.mem.tasks, i + ".title") ?? "task", S.mem.tasks[i] || {}];
  if (table === "school") return [g(S.mem.school, i + ".title") ?? "school item", S.mem.school[i] || {}];
  return ["detail", {}];
}

function openDrawer(kind) {
  const drawer = document.getElementById("drawer");
  if (!drawer) return;
  const [title, obj] = drawerData(kind);
  document.getElementById("drawer-title").textContent = String(title);
  document.getElementById("drawer-body").innerHTML = `<div class="nodata" style="margin-bottom:10px">raw fields · source payload</div>${kvTable(obj)}`;
  drawer.dataset.open = "true";
  const back = document.getElementById("drawer-back");
  back.hidden = false;
  document.getElementById("drawer-close").focus();
}

function closeDrawer() {
  const drawer = document.getElementById("drawer");
  if (!drawer || drawer.dataset.open !== "true") return false;
  drawer.dataset.open = "false";
  document.getElementById("drawer-back").hidden = true;
  return true;
}

/* ---------- web wiring ---------- */

function wireWeb() {
  const root = app;

  root.querySelectorAll("[data-tab]").forEach((b) =>
    b.addEventListener("click", () => {
      const id = b.dataset.tab;
      setParam("section", id);
      S.params.section = id;
      root.querySelectorAll("[data-tab]").forEach((x) => (x.ariaCurrent = x === b ? "true" : "false"));
      scrollToSection(id, true);
    }),
  );

  root.querySelector("[data-theme-toggle]")?.addEventListener("click", () => {
    S.theme = S.theme === "dark" ? "light" : "dark";
    setParam("theme", S.theme);
    render();
  });

  root.querySelectorAll("[data-filter]").forEach((b) =>
    b.addEventListener("click", () => {
      S.filters.automations = b.dataset.filter;
      setParam("filter", b.dataset.filter === "all" ? null : b.dataset.filter);
      renderWeb();
    }),
  );

  root.querySelectorAll("[data-tllevel]").forEach((b) =>
    b.addEventListener("click", () => {
      S.filters.tlLevel = b.dataset.tllevel;
      setParam("level", b.dataset.tllevel === "all" ? null : b.dataset.tllevel);
      renderWeb();
    }),
  );

  root.querySelectorAll("[data-tlsource]").forEach((b) =>
    b.addEventListener("click", () => {
      S.filters.tlSource = b.dataset.tlsource;
      setParam("src", b.dataset.tlsource === "all" ? null : b.dataset.tlsource);
      renderWeb();
    }),
  );

  root.querySelectorAll("[data-drawer]").forEach((b) =>
    b.addEventListener("click", (e) => {
      e.stopPropagation();
      openDrawer(b.dataset.drawer);
    }),
  );

  document.getElementById("drawer-close")?.addEventListener("click", closeDrawer);
  document.getElementById("drawer-back")?.addEventListener("click", closeDrawer);

  // keyboard: j/k row navigation, Enter opens (native buttons), Esc closes drawer
  document.onkeydown = (e) => {
    if (e.key === "Escape" && closeDrawer()) return;
    if (e.key === "Tab") trapDrawerFocus(e);
    if (e.key !== "j" && e.key !== "k") return;
    const rows = [...root.querySelectorAll(".row:not([disabled]), .tl-row")];
    if (!rows.length) return;
    const cur = rows.indexOf(document.activeElement);
    const next = e.key === "j" ? Math.min(rows.length - 1, cur + 1) : Math.max(0, cur - 1);
    rows[next === -1 && e.key === "j" ? 0 : next === -1 ? rows.length - 1 : next].focus();
    e.preventDefault();
  };

  // scrollspy
  let spy = 0;
  window.onscroll = () => {
    clearTimeout(spy);
    spy = setTimeout(() => {
      const y = window.scrollY + 140;
      let cur = "";
      for (const [id] of SECTIONS) {
        const el = document.getElementById("sec-" + id);
        if (el && el.offsetTop <= y) cur = id;
      }
      if (cur && cur !== S.params.section) {
        S.params.section = cur;
        setParam("section", cur);
        root.querySelectorAll("[data-tab]").forEach((x) => (x.ariaCurrent = x.dataset.tab === cur ? "true" : "false"));
      }
    }, 180);
  };
}

function trapDrawerFocus(e) {
  const drawer = document.getElementById("drawer");
  if (!drawer || drawer.dataset.open !== "true") return;
  const f = [...drawer.querySelectorAll("button, [href]")];
  if (!f.length) return;
  const first = f[0];
  const last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first) {
    last.focus();
    e.preventDefault();
  } else if (!e.shiftKey && document.activeElement === last) {
    first.focus();
    e.preventDefault();
  }
}

function scrollToSection(id, smooth) {
  const el = document.getElementById("sec-" + id);
  if (!el) return;
  el.scrollIntoView({ behavior: smooth ? "smooth" : "auto", block: "start" });
}

function boot() {

}

function wpJobs() {

  if (pend || !jobs || !jobs.length) {

    const note = pend
      ? `collector pending · v2 not wired — per-job rows await the v2 collector`
      : `no cron jobs in payload`;
    return `<div class="wp-jobs pending">
      <div>
        <div class="wp-note">${esc(note)}</div>
        <div class="cells wp-fill">
          ${cell({ label: "cron total", value: valNum(cron.total) })}

          ${cell({ label: "failing", value: valNum(cron.failing), state: num(cron.failing) > 0 ? "bad" : "good" })}
          ${cell({ label: "no agent", value: valNum(cron.no_agent) })}
        </div>
      </div>
    </div>`;
  }
  const isFail = (j) => (num(j.success_7d) !== null && j.success_7d < 100) || (j.last_status && j.last_status !== "completed");
  const sorted = jobs.slice().sort((a, b) => (isFail(b) ? 1 : 0) - (isFail(a) ? 1 : 0) ||
    (parseTs(a.next_run)?.getTime() ?? Infinity) - (parseTs(b.next_run)?.getTime() ?? Infinity));
  const fails = sorted.filter(isFail);
  const rest = sorted.filter((j) => !isFail(j));
  // failures pinned to the top of the left column; columns split evenly so the
  // stretched rows stay the same height on both sides and fill the stage
  const half = Math.max(fails.length, Math.ceil(sorted.length / 2));
  const left = [...fails, ...rest.slice(0, half - fails.length)];
  const right = rest.slice(half - fails.length);
  const wrow = (j) => `<div class="wrow${isFail(j) ? " fail" : ""}">
    <span class="nm">${esc(j.name ?? "—")}</span>
    <span class="nx">${fmtNextRun(j.next_run)}</span>

  return `<div class="wp-mp">
    <div class="wp-mp-top">${mediaHtml}</div>
    <div class="cells">
      ${cell({ label: "tasks open", value: valNum(t.open), sub: `${valNum(t.overdue)} overdue` })}
      ${cell({ label: "school upcoming", value: valNum(sc.upcoming), sub: "next 7 days" })}
      ${cell({ label: "journal · 7d", value: valNum(jn.entries_7d), sub: `last ${val(jn.last)}` })}
    </div>
    <div class="wp-mp-cols">
      <div><div class="gx" style="font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px">school · due next</div>
        <div class="wp-list">${school.map(wrow).join("") || `<div class="wp-note">nothing due in window</div>`}</div></div>
      <div><div class="gx" style="font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px">tasks · open</div>
        <div class="wp-list">${tasks.map(wrow).join("") || `<div class="wp-note">no open tasks in payload</div>`}</div></div>
    </div>
  </div>`;
}

/* ---------- alert rail + banner ---------- */

function wallTopAlert() {
  if (!S.data) return { level: "info", text: "connecting to live source", right: "" };
  const now = Date.now();
  const L = g(S.data, "surfaces.personal.listening") || {};
  const cron = g(S.data, "surfaces.mac_mini.hermes.cron") || {};
  const cands = [];
  const jf = num(cron.failing) ?? num(L.jobs_failing) ?? 0;
  if (jf > 0) cands.push({ level: "bad", text: `${jf} cron job${jf > 1 ? "s" : ""} failing`, at: now });
  if (num(L.homelab_issues_bad) > 0) cands.push({ level: "bad", text: `${L.homelab_issues_bad} homelab fault${L.homelab_issues_bad > 1 ? "s" : ""}`, at: now });
  if (num(g(S.data, "surfaces.docker_vm.counts.unhealthy")) > 0) {
    cands.push({ level: "bad", text: `${g(S.data, "surfaces.docker_vm.counts.unhealthy")} unhealthy containers`, at: now });
  }
  const age = (t) => (t ? fmtDur((now - t) / 1000) : "");
  for (const e of g(S.data, "timeline") || []) {
    const d = parseTs(e.ts);
    if (!d) continue;
    const ago = now - d.getTime();
    if (ago > 48 * 3600 * 1000) continue;
    cands.push({ level: e.level === "bad" ? "bad" : e.level === "warn" ? "warn" : "info", text: e.text, at: d.getTime() });
  }
  const rank = { bad: 3, warn: 2, info: 1 };
  cands.sort((a, b) => rank[b.level] - rank[a.level] || b.at - a.at);
  if (!cands.length || cands[0].level === "info") {
    const last = (g(S.data, "timeline") || [])[0];
    return {
      level: "none",
      text: `all clear${last ? " · last: " + String(last.text).slice(0, 60) : ""}`,
      right: last ? "last " + age(parseTs(last.ts)?.getTime()) : "",
    };
  }
  const c = cands[0];
  return { level: c.level, text: c.text, right: "last " + age(c.at) };
}

function wallRailHtml() {
  const a = wallTopAlert();
  const cls = a.level === "bad" ? "bad" : a.level === "warn" ? "warn" : "";
  const mark = a.level === "none" ? "✓" : "!";
  const who = S.data
    ? `updated ${fmtAge(g(S.data, "generated_at"))} ago · ${g(S.data, "generated_on") ?? ""}`
    : "syncing";
  return `<span style="color:var(--${a.level === "bad" ? "bad" : a.level === "warn" ? "warn" : "cyan"});font-weight:600">${mark}</span>
    <span class="${cls}" style="${cls ? "" : "color:var(--muted)"}">${esc(a.text)}</span>
    <span class="who">${esc(a.right ? a.right + " · " : "")}${esc(who)}</span>`;
}

function wallBannerHtml() {
  if (!S.data) return { show: false, html: "" };
  // one failed source is not a feed outage — the banner speaks payload mode,
  // never "FEED DOWN" (a payload is always on screen: live, snapshot or seed)
  if (S.source === "seed") return { show: true, html: banner("mute", "DESIGN FIXTURE · not live data") };
  if (S.source === "snapshot") {
    return { show: true, html: banner("mute", `snapshot · ${fmtAge(g(S.data, "generated_at"))} old`) };
  }
  if (S.source === "live" || S.source === "stale") {
    const d = parseTs(g(S.data, "generated_at"));
    if (!d) return { show: false, html: "" };
    const ageS = (Date.now() - d.getTime()) / 1000;
    if (ageS > 90) {
      return { show: true, html: banner(ageS > 300 ? "bad" : "warn", `data stale · last update ${fmtClock(d)}`, "retrying live source") };
    }
  }
  return { show: false, html: "" };
}

/* ---------- rotation engine ---------- */

function wallShow(i, restartProgress = true) {
  WALL.idx = ((i % 5) + 5) % 5;
  WALL.lastSwitch = Date.now();
  document.querySelectorAll(".wall-page").forEach((el, k) => (el.dataset.active = k === WALL.idx ? "true" : "false"));
  const pi = document.getElementById("wall-page-i");
  if (pi) pi.textContent = `${WALL.idx + 1}/5`;
  const prog = document.getElementById("wall-prog");
  if (prog && restartProgress && !WALL.paused) {
    prog.classList.remove("run");
    void prog.offsetWidth; // restart the animation
    prog.style.animationDuration = `${WALL.dwell}ms`;
    prog.classList.add("run");
  } else if (prog) {
    prog.classList.remove("run");
  }
}

function wallPause(reason) {
  if (WALL.pauseReason === "page") return; // pinned stays pinned
  WALL.paused = true;
  WALL.pauseReason = reason;
  WALL.lastKey = Date.now();
  const prog = document.getElementById("wall-prog");
  if (prog) prog.classList.remove("run");
  const pi = document.getElementById("wall-page-i");
  if (pi) pi.textContent = `${WALL.idx + 1}/5 · paused`;
}

function wallResume() {
  WALL.paused = false;
  WALL.pauseReason = "";
  wallShow(WALL.idx);
}

/* ---------- render ---------- */

function wallRender() {
  if (!WALL.built) {
    app.innerHTML = wallShell();
    WALL.built = true;
    const dwell = num(Number(S.params.dwell));
    if (dwell !== null && dwell >= 1000) WALL.dwell = dwell;
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) wallPause("motion");
    if (S.params.page) {
      const n = Number(S.params.page);
      if (Number.isInteger(n) && n >= 1 && n <= 5) {
        WALL.idx = n - 1;
        WALL.pauseReason = "page";
        WALL.paused = true;
      }
    }
    document.addEventListener("keydown", () => {
      if (WALL.pauseReason === "page") return;
      wallPause("key");
    });
    // burn-in shift: 1px, 4 positions, 60s cycle
    if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      setInterval(() => {
        WALL.shiftPos = (WALL.shiftPos + 1) % 4;
        const el = document.getElementById("wall-shift");
        if (el) {
          const offs = [[0, 0], [1, 0], [1, 1], [0, 1]][WALL.shiftPos];
          el.style.transform = `translate(${offs[0]}px, ${offs[1]}px)`;
        }
      }, 60000);
    }
    wallShow(WALL.idx);
    WALL.tick = setInterval(wallTick, 1000);
  }

  // fill pages from current data (works for syncing, seed and live)
  const pages = [wpStatus, wpJobs, wpHomelab, wpServices, wpMediaPersonal];
  pages.forEach((fn, i) => {
    const el = document.getElementById("wp-" + i);
    if (el) el.innerHTML = fn();
  });

  const pillEl = document.getElementById("wall-pill");
  if (pillEl) pillEl.innerHTML = pillFor(S.source);
  const rail = document.getElementById("wall-rail");
  if (rail) rail.innerHTML = wallRailHtml();
  const b = wallBannerHtml();
  const bannerEl = document.getElementById("wall-banner");
  if (bannerEl) {
    bannerEl.innerHTML = b.html;
    bannerEl.dataset.show = b.show ? "true" : "false";
  }
  wallClockUpdate();
}

function wallClockUpdate() {
  const now = new Date();
  const c = document.getElementById("wall-clock");
  if (c) c.textContent = `${fmtWallDate(now)} ${fmtClock(now)}`;
  const bc = document.getElementById("wp-bigclock");
  if (bc) bc.textContent = fmtClock(now);
  const bd = document.getElementById("wp-bigdate");
  if (bd) bd.textContent = fmtWallDate(now);
  // night dim 22:00–07:00
  const wall = document.getElementById("wall");
  if (wall) wall.classList.toggle("wall-dim", now.getHours() >= 22 || now.getHours() < 7);
}

function wallTick() {
  wallClockUpdate();
  if (WALL.paused) {
    if (WALL.pauseReason === "key" && Date.now() - WALL.lastKey >= 60000) wallResume();
    return;
  }
  if (Date.now() - WALL.lastSwitch >= WALL.dwell) wallShow(WALL.idx + 1);
  // banners + rail react to data age
  const b = wallBannerHtml();
  const bannerEl = document.getElementById("wall-banner");
  if (bannerEl) {
    bannerEl.innerHTML = b.html;
    bannerEl.dataset.show = b.show ? "true" : "false";
  }
  const rail = document.getElementById("wall-rail");
  if (rail) rail.innerHTML = wallRailHtml();
}

/* cold boot: no localStorage, no dialogs, no first-run state anywhere above */

boot();

    </script>
